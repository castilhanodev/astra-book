/* ================= Astra Pro: limites do plano grátis, tela de planos e anúncios ================= */
const PRO=(()=>{
  /* o que o plano grátis permite */
  const LIM={books:3,words:10,marks:20};
  const PLANS=[
    {id:'astra_pro_mensal',label:'Mensal',per:'por mês'},
    {id:'astra_pro_trimestral',label:'Trimestral',per:'a cada 3 meses'},
    {id:'astra_pro_anual',label:'Anual',per:'por ano'}
  ];
  /* a assinatura fica na conta, nao no perfil: quem assina libera todos os perfis dela */
  const contaId=()=>LS.get('astra.conta',null)||S.pid||(profiles()[0]||{}).id||'local';
  const proKey=()=>'astra.pro.'+contaId(), rewardKey=()=>'astra.rewards.'+S.pid;
  const get=()=>LS.get(proKey(),null);
  function isPro(){const p=get();if(!p||p.source!=='verified')return false;if(p.until&&p.until<Date.now())return false;return !!p.on}
  function setPro(on,plan,until,source='verified'){LS.set(proKey(),{on:!!on,plan:plan||'',until:until||0,source:on?source:'',at:Date.now()});paintPro()}
  /* créditos permanentes por anúncios premiados, separados por perfil */
  const rewards=()=>Object.assign({bookProgress:0,books:0,words:0,marks:0},LS.get(rewardKey(),null)||{});
  const limit=k=>LIM[k]+(rewards()[k]||0);
  function giveReward(k){
    const r=rewards();
    if(k==='books'){
      r.bookProgress++;
      if(r.bookProgress===3){r.books++;r.bookProgress=0;toast('Mais 1 PDF liberado para importação!','ok')}
      else toast(`Vídeo ${r.bookProgress} de 3 concluído. Faltam ${3-r.bookProgress}.`,'ok');
    }else if(k==='words'||k==='marks'){
      r[k]+=5;toast(k==='words'?'Mais 5 consultas liberadas!':'Mais 5 destaques liberados!','ok');
    }
    LS.set(rewardKey(),r);paintPro();
  }

  const nBooks=()=>S.books.filter(b=>!b.demo&&!b.builtin).length;
  const nMarks=()=>S.books.reduce((n,b)=>n+(b.highlights||[]).length,0);
  /* o limite conta o que já foi usado na vida do perfil: apagar não devolve vaga */
  const useKey=()=>'astra.used.'+S.pid;
  /* palavras consultadas no dicionário (o limite é olhar, não guardar) */
  const dictKey=()=>'astra.dictw.'+S.pid;
  const dictList=()=>LS.get(dictKey(),[])||[];
  const dictCount=()=>dictList().length;
  function contaConsulta(w){const k=fold(String(w||'').trim());if(!k)return dictCount();
    const L=dictList();if(!L.includes(k)){L.push(k);if(L.length>300)L.splice(0,L.length-300);LS.set(dictKey(),L)}
    return L.length}
  const jaConsultou=w=>dictList().includes(fold(String(w||'').trim()));
  function used(){
    const u=Object.assign({books:0,words:0,marks:0},LS.get(useKey(),null)||{});
    const cur={books:nBooks(),words:dictCount(),marks:nMarks()};
    let mudou=false;
    for(const k of ['books','words','marks']){const v=Math.max(u[k]||0,cur[k]||0);if(v!==u[k]){u[k]=v;mudou=true}}
    if(mudou)LS.set(useKey(),u);
    return u;
  }
  const okK=k=>{const u=used();
    if(k==='books')return u.books<limit('books');
    if(k==='words')return dictCount()<limit('words');
    return u.marks<limit('marks')};
  /* pode usar? devolve true, ou abre a tela de planos */
  function allow(kind){
    if(isPro())return true;
    if(['books','words','marks'].includes(kind))return okK(kind)?true:(paywall(kind),false);
    return true;
  }
  const can=k=>isPro()||okK(k);
  const LEFT={books:()=>Math.max(0,limit('books')-used().books),words:()=>Math.max(0,limit('words')-dictCount()),marks:()=>Math.max(0,limit('marks')-used().marks)};

  /* ---------- compra pelo Google Play ---------- */
  const CDV=()=>window.CdvPurchase||null;
  const billingCfg=()=>window.ASTRA_BILLING||{};
  const billingReady=()=>billingCfg().enabled===true&&/^https:\/\//i.test(String(billingCfg().validatorUrl||''));
  let store=null,ready=false,products={};
  function initStore(){
    const C=CDV();if(!C||store||!billingReady())return;
    try{
      store=C.store;
      store.validator=billingCfg().validatorUrl;
      store.validator_privacy_policy=['fraud','support'];
      store.register(PLANS.map(p=>({id:p.id,type:C.ProductType.PAID_SUBSCRIPTION,platform:C.Platform.GOOGLE_PLAY})));
      store.when()
        .productUpdated(()=>{PLANS.forEach(p=>{const pr=store.get(p.id);if(pr)products[p.id]=pr});repaintPaywall()})
        .approved(t=>t.verify())
        .verified(async r=>{aplicar(r);await r.finish()})
        .finished(()=>{});
      store.initialize([C.Platform.GOOGLE_PLAY]).then(()=>{ready=true});
    }catch(e){console.error(e)}
  }
  function aplicar(r){
    try{
      const ids=new Set(PLANS.map(p=>p.id));
      const compras=(r.collection||[]).filter(p=>ids.has(p.id));
      if(!compras.length)return;
      const ativas=compras.filter(p=>!p.isExpired&&(!p.expiryDate||p.expiryDate>Date.now()));
      if(!ativas.length){setPro(false);toast('Sua assinatura Astra Pro não está ativa.','err',4000);return}
      ativas.sort((a,b)=>(b.expiryDate||0)-(a.expiryDate||0));
      const p=ativas[0];setPro(true,p.id,p.expiryDate||0,'verified');
      toast('Astra Pro ativado. Aproveite!','ok',4000);$('#paywall')?.remove();
    }catch(e){console.error(e)}
  }
  function buy(id){
    const C=CDV();if(!billingReady()){toast('O Astra Pro está sendo preparado para a Play Store.','err',4500);return}
    if(!C||!store||!ready){toast('A compra só funciona no aplicativo instalado pela Play Store.','err',4500);return}
    const pr=store.get(id);
    const offer=pr?.offers?.find(o=>o.canPurchase&&o.pricingPhases?.[0]?.priceMicros===0)
      ||pr?.offers?.find(o=>o.canPurchase)||pr?.getOffer?.();
    if(!offer){toast('Plano indisponível agora. Tente de novo em instantes.','err',4000);return}
    offer.order().then(e=>{if(e)toast('Compra não concluída.','err')}).catch(()=>{});
  }
  function restore(){
    if(!billingReady()){toast('A restauração será liberada com o Astra Pro na Play Store.','err',4500);return}
    if(!store||!ready){toast('Disponível só no aplicativo instalado pela Play Store.','err');return}
    store.restorePurchases().then(e=>{if(e)toast('Não consegui restaurar agora.','err');else toast('Compras consultadas. A validação será atualizada em instantes.')})
  }

  /* ---------- tela de planos ---------- */
  const WHY={
    books:['Você usou suas importações grátis.','Assista a 3 vídeos para liberar mais uma importação de PDF, ou assine o Astra Pro para importar PDFs sem limite.'],
    words:['Você usou suas consultas grátis.','Assista a um vídeo para liberar mais 5 palavras, ou assine o Astra Pro para consultar sem limite.'],
    marks:['Você usou seus destaques grátis.','Assista a um vídeo para liberar mais 5 destaques, ou assine o Astra Pro para destacar sem limite.'],
    ads:['Cansou dos anúncios?','O Astra Pro tira todos eles.'],
    temas:['Mais temas para o seu post.','O Astra Pro libera todos os estilos de imagem da frase.'],
    perfis:['Mais perfis na mesma conta.','No plano grátis a conta tem um perfil. Com o Astra Pro você cria perfis para quem mora com você, cada um com a própria estante, sem pagar de novo.'],
    free:['Leve o Astra mais longe.','Tudo sem limite e sem anúncio.']
  };
  const PERKS=[['book','PDFs importados sem limite'],['spark','Meu dicionário sem limite'],['hl','Marca-texto e frases sem limite'],['close','Sem anúncios'],['share','Mais temas para o cartão da frase'],['flame','Cores de tema extras'],['user','Perfis para quem mora com você']];
  let payReason='free';
  /* telinha de atenção antes de importar, mostrando quantas importações sobram */
  function avisoImport(qtd,livre){
    return new Promise(res=>{
      const dep=Math.max(0,livre-qtd);
      const t=qtd===1?'Este livro vai usar 1 das suas importações.':`Estes ${qtd} livros vão usar ${qtd} das suas importações.`;
      const {el,close}=openSheet(`<div class="sheet-h"><h3>Atenção</h3><button class="icon-btn" data-close aria-label="Fechar">${ic('close')}</button></div>
        <div class="sheet-b"><div class="goalhero">${astro('apontando',70)}<div><b>${livre===1?'Resta 1 importação no plano grátis':`Restam ${livre} importações no plano grátis`}</b><span>${t} ${dep===0?'Depois desta, a estante fecha no plano grátis.':`Depois desta, sobra${dep===1?'':'m'} ${dep}.`} Apagar um livro não devolve a vaga.</span></div></div>
         <p class="note" style="margin:0 0 14px">No Astra Pro você importa PDFs sem limite, fica sem anúncios e libera o dicionário e o marca-texto.</p>
        <button class="btn btn-primary btn-block" id="avPro">${ic('star')}Conhecer o Astra Pro</button>
        <button class="btn btn-ghost btn-block" id="avGo">Importar assim mesmo</button></div>`,{onClose:()=>res(false)});
      let feito=false;
      const fim=v=>{if(feito)return;feito=true;res(v);close()};
      $('#avGo',el).onclick=()=>fim(true);
      $('#avPro',el).onclick=()=>{fim(false);setTimeout(()=>paywall('books'),320)};
    });
  }
  function paywall(reason='free'){
    payReason=reason;if($('#paywall'))return;initStore();
    const d=document.createElement('div');d.className='paywall';d.id='paywall';
    d.innerHTML=`<div class="pwc">
      <button class="icon-btn pwx" data-x aria-label="Fechar">${ic('close')}</button>
      <div class="pwlogo">${astro('comemorando',112,'float')}</div>
      <div class="label">Astra Pro</div><h2>${esc(WHY[reason][0])}</h2><p>${esc(WHY[reason][1])}</p>
      <div class="pwperks">${PERKS.map(([i,t])=>`<div>${ic(i)}<span>${t}</span></div>`).join('')}</div>
      <div class="pwplans" id="pwPlans">${planCards()}</div>
      <button class="btn btn-primary btn-block" id="pwGo">Assinar pela Play Store</button>
       <p class="note" id="pwNote">A Play Store mostrará o preço, eventual teste grátis e a data da primeira cobrança antes da confirmação. A assinatura renova automaticamente e pode ser cancelada pela sua conta Google.</p>
       ${['books','words','marks'].includes(reason)?`<button class="btn btn-ghost btn-sm btn-block" id="pwAd">${ic('spark')}${reason==='books'?`Ver vídeo ${rewards().bookProgress+1} de 3 para liberar 1 PDF`:reason==='words'?'Ver vídeo e liberar 5 palavras':'Ver vídeo e liberar 5 destaques'}</button>`:''}
      <button class="btn btn-ghost btn-sm btn-block" id="pwRest">Já assinei, restaurar compra</button>
    </div>`;
    document.body.append(d);
     let sel='astra_pro_mensal';
    const paint=()=>{$$('.pwplan',d).forEach(b=>b.classList.toggle('on',b.dataset.p===sel));
       $('#pwNote',d).textContent='A Play Store mostrará o preço, eventual teste grátis e a data da primeira cobrança antes da confirmação. A assinatura renova automaticamente e pode ser cancelada pela sua conta Google.'};
    paint();
    d.addEventListener('click',e=>{
      const pl=e.target.closest('.pwplan');if(pl){sel=pl.dataset.p;paint();return}
      if(e.target.closest('[data-x]')||e.target===d){d.classList.add('out');setTimeout(()=>d.remove(),250);return}
      if(e.target.closest('#pwGo'))buy(sel);
      if(e.target.closest('#pwRest'))restore();
       if(e.target.closest('#pwAd'))ADS.reward(()=>{giveReward(payReason);d.remove()});

const ADS=(()=>{
  const cfg=window.ASTRA_ADS||null;
  const A=()=>window.AstraAdMob||null;
  const on=()=>!!(cfg&&cfg.enabled&&cfg.interstitial&&A()&&!PRO.isPro());
  let started=false,lastAd=0,rewardBusy=false;
  async function init(){
    if(started)return true;
    if(!cfg?.enabled||!A())return false;
    try{
      let consent=await A().requestConsentInfo();
      if(consent.isConsentFormAvailable&&consent.status==='REQUIRED')consent=await A().showConsentForm();
      if(!consent.canRequestAds)return false;
      await A().initialize({initializeForTesting:!!cfg.test});started=true;return true;
    }catch(e){console.warn('Anúncios indisponíveis:',e);return false}
  }
  /* anúncio de tela cheia, no máximo um a cada 20 minutos e só ao sair do livro */
  async function interstitial(){
    if(!on()||Date.now()-lastAd<20*60000)return false;
    try{if(!await init())return false;await A().prepareInterstitial({adId:cfg.interstitial,isTesting:!!cfg.test});await A().showInterstitial();lastAd=Date.now();return true}catch(e){return false}
  }
  /* vídeo premiado: a pessoa escolhe assistir */
  async function reward(onOk){
    if(rewardBusy)return;
    if(!cfg?.enabled||!cfg.rewarded||!A()){toast('Vídeo indisponível agora.','err');return}
    rewardBusy=true;
    try{
      if(!await init())throw new Error('Consentimento ou SDK indisponível');
      await A().prepareRewardVideoAd({adId:cfg.rewarded,isTesting:!!cfg.test});
      const r=await A().showRewardVideoAd();
      if(Number(r?.amount)>0)onOk&&onOk();
      else toast('Assista ao vídeo completo para receber a recompensa.','err');
    }catch(e){console.warn('Vídeo premiado:',e);toast('Não consegui carregar o vídeo.','err')}
    finally{rewardBusy=false}
  }
  return{init,interstitial,reward,on};
})();

const NOTIF=(()=>{
  const LN=()=>(window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications)||null;
  const AS=()=>(window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Astra)||null;
  const CH='astra-lembrete';
  const rem=()=>Object.assign({on:false,h:20,m:0,granted:false},(S.set&&S.set.remind)||{});
  const save=o=>{S.set.remind=Object.assign(rem(),o);saveSet();return S.set.remind};
  const hhmm=r=>String(r.h).padStart(2,'0')+':'+String(r.m).padStart(2,'0');
  const goal=()=>S.set&&S.set.goal||20;
  const native=()=>!!LN();
  /* o celular está mesmo deixando notificar? */
  async function perm(){
    const L=LN();
    if(L){try{const p=await L.checkPermissions();return p&&p.display==='granted'}catch(e){return false}}
    if('Notification' in window)return Notification.permission==='granted';
    return false;
  }
  /* pede a permissão; confere de novo depois, porque alguns aparelhos respondem antes da hora */
  async function ask(){
    const L=LN();
    if(L){
      try{
        let p=await L.checkPermissions();
        if(!p||p.display!=='granted'){try{p=await L.requestPermissions()}catch(e){}}
        if(!p||p.display!=='granted'){await new Promise(r=>setTimeout(r,900));try{p=await L.checkPermissions()}catch(e){}}
        return !!(p&&p.display==='granted');
      }catch(e){console.error(e);return false}
    }
    if('Notification' in window){try{if(Notification.permission==='granted')return true;return (await Notification.requestPermission())==='granted'}catch(e){return false}}
    return false;
  }
  async function channel(){const L=LN();if(!L||!L.createChannel)return;
    try{await L.createChannel({id:CH,name:'Lembretes de leitura',description:'Aviso diário para você bater a sua meta',importance:4,visibility:1})}catch(e){}}
  async function openSettings(){const P=AS();
    if(P&&P.openNotificationSettings){try{await P.openNotificationSettings();return true}catch(e){console.error(e)}}
    toast('Abra as configurações do celular, procure o Astra Book e ligue as notificações.','err',6000);return false}
  let wt=[];const clearWeb=()=>{wt.forEach(clearTimeout);wt=[]};
  const IDS=[{id:2},{id:3},{id:11},{id:12}];
  async function sync(){
    const L=LN(),r=rem();
    if(L){
      try{await L.cancel({notifications:IDS})}catch(e){}
      if(!r.on)return false;
      const ok=await perm();
      if(r.granted!==ok)save({granted:ok});
      if(!ok)return false;
      await channel();
      const n=streak();
      /* 1) de manhã, um empurrãozinho para abrir o app */
      const list=[{id:11,channelId:CH,smallIcon:'ic_stat_astra',isExactNotification:false,title:'Bom dia, hora de ler',
        body:n>1?`Você está com ${n} dias seguidos. Comece o dia com alguns minutos de leitura.`:'Alguns minutos de leitura agora já contam para a sua meta.',
        schedule:{on:{hour:9,minute:0}}}];
      /* 2) no horário que a pessoa escolheu (padrão 20h) */
      list.push({id:12,channelId:CH,smallIcon:'ic_stat_astra',isExactNotification:false,title:'Seu livro está esperando',
        body:`Sua meta de ${goal()} minutos está te esperando no Astra Book.`,
        schedule:{on:{hour:+r.h,minute:+r.m}}});
      /* 3) só se ainda faltar leitura hoje e o horário escolhido for cedo */
      if(minutesToday()<goal()){const d=new Date();d.setHours(21,30,0,0);
        if(d.getTime()>Date.now()+120000&&+r.h<20)
          list.push({id:2,channelId:CH,smallIcon:'ic_stat_astra',isExactNotification:false,title:n>0?`Não perca seus ${n} dia${n===1?'':'s'} seguidos`:'Um dia só conta se você ler',body:`Faltam ${Math.max(1,goal()-minutesToday())} minutos para o dia de hoje contar.`,schedule:{at:d}})}
      try{await L.schedule({notifications:list});return true}catch(e){console.error(e);return false}
    }
    clearWeb();
    if(!r.on)return false;
    const ok=await perm();if(r.granted!==ok)save({granted:ok});
    if(!ok||!('Notification' in window))return false;
    const nx=new Date();nx.setHours(+r.h,+r.m,0,0);if(nx.getTime()<=Date.now())nx.setDate(nx.getDate()+1);
    const ms=nx.getTime()-Date.now();if(ms<2147483000)wt.push(setTimeout(()=>{try{new Notification('Hora de ler',{body:`Sua meta de ${goal()} minutos está te esperando.`})}catch(e){}sync()},ms));
    return true;
  }
  /* aviso na hora, só para a pessoa ver que funcionou */
  async function hello(){const L=LN();if(!L)return;const r=rem();
    try{await channel();await L.schedule({notifications:[{id:3,channelId:CH,smallIcon:'ic_stat_astra',isExactNotification:false,title:'Lembrete ligado',body:`Eu te chamo de manhã e às ${hhmm(r)}.`,schedule:{at:new Date(Date.now()+5000)}}]})}catch(e){}}
  async function enable(h,m){
    save({on:true,h:+h,m:+m});
    const ok=await ask();
    save({granted:ok});
    if(ok){await sync();hello()}
    return ok;
  }
  async function off(){save({on:false});await sync();const L=LN();if(L){try{await L.cancel({notifications:IDS.concat([{id:1}])})}catch(e){}}}
  /* quando a pessoa volta das configurações do celular, liga sozinho */
  let checking=false;
  async function recheck(quiet){
    if(checking)return;checking=true;
    try{const r=rem();if(!r.on)return;
      const ok=await perm();
      if(ok&&!r.granted){save({granted:true});await sync();try{document.querySelectorAll('.remwarn').forEach(n=>n.remove())}catch(e){}if(!quiet)toast(`Lembrete ligado. Todo dia às ${hhmm(rem())} eu te chamo.`,'ok',4500)}
      else if(!ok&&r.granted){save({granted:false})}
      else if(ok){await sync()}
    }catch(e){console.error(e)}finally{checking=false}
  }
  function metGoal(){const L=LN();if(L)L.cancel({notifications:[{id:2}]}).catch(()=>{})}
  /* pede a permissão somente depois que a pessoa escolhe salvar o lembrete */
  async function setTime(h,m){save({h:+h,m:+m,on:true});let ok=await perm();if(!ok)ok=await ask();save({granted:ok});if(ok){await sync();hello()}return ok}
  /* o lembrete já vem ligado às 20h; quem não quiser desliga na folha da meta */
  function setDefault(){if(!(S.set&&S.set.remind))save({on:true,h:20,m:0,granted:false});return rem()}
  /* entrar no app nunca dispara uma permissão inesperada; apenas confere o que já foi escolhido */
  async function onEnter(){
    setDefault();
    await recheck(true);return rem().granted;
  }
  return{ask,perm,sync,enable,off,rem,hhmm,metGoal,native,openSettings,recheck,setDefault,onEnter,setTime};
})();

    {alvo:'#rZoom',pose:'apontando', t:'Zoom que fica', d:'Dê o zoom que achar melhor e toque aqui para memorizar. As próximas páginas já abrem no mesmo tamanho.'},

    {pose:'comemorando', t:'Boa leitura!', d:'As palavras que você consultar ficam no caderno, lá na estante. Qualquer dúvida, o tutorial volta pelo menu do perfil.'}
  ];
  /* explicação que aparece na primeira vez que a ficha da palavra abre */
  const FICHA=[
    {alvo:'.ai-head', pose:'lupa', t:'Esta é a ficha da palavra', d:'Você segurou a palavra no livro e eu fui procurar. Aqui em cima fica a palavra e a classe dela. Você entende sem precisar sair da leitura.', espera:4000},
    {alvo:'.ai-card.simple', pose:'apontando', t:'Em palavras simples', d:'Este é o significado no sentido em que a palavra aparece na sua frase, não uma lista solta de sentidos.', espera:4000},
    {alvo:'#dQ', pose:'livro', t:'A sua frase', d:'É o trecho do livro onde a palavra estava. Toque num sinônimo para ver a frase com ele no lugar. Isso é só para conferir: o texto do livro nunca muda.', espera:4000},
    {alvo:'#sFit', pose:'apontando', t:'Sinônimos que encaixam', d:'Já vêm no gênero, número e tempo certos para caber na frase, por isso alguns aparecem diferentes da forma do dicionário.', espera:4000},
    {alvo:'#dSave', pose:'joia', t:'Guardar no caderno', d:'Aqui você guarda palavras que ainda não conhece para estudar depois. No caderno elas também viram perguntas de um quiz, feito com as suas próprias palavras.', espera:4000}
  ];

  /* ---------------- bloqueio do app ---------------- */
  function comer(e){
    if(!atual)return;
    if(e.target&&e.target.closest&&e.target.closest('.tour-bal'))return;
    if(atual.passo&&atual.passo.acao&&e.target&&e.target.closest&&atual.el&&atual.el.contains(e.target))return;
    e.preventDefault();e.stopPropagation();
  }
  function comerTecla(e){
    if(!atual)return;
    if(e.target&&e.target.closest&&e.target.closest('.tour-bal'))return;
    if(e.key==='Tab')return;
    e.preventDefault();e.stopPropagation();
  }
  const EVT=['wheel','touchmove','scroll'];
  function travar(){
    EVT.forEach(n=>window.addEventListener(n,comer,{capture:true,passive:false}));
    window.addEventListener('keydown',comerTecla,true);
  }
  function destravar(){
    EVT.forEach(n=>window.removeEventListener(n,comer,{capture:true}));
    window.removeEventListener('keydown',comerTecla,true);
  }

  function limpar(){
    token++;
    document.querySelectorAll('.tour-foco,.tour-bal,.tour-cap,.tour-pan,.tour-tampa').forEach(n=>n.remove());
    window.removeEventListener('resize',repor);
    destravar();
    if(atual&&atual.tim)clearInterval(atual.tim);
    if(atual&&atual.relogio)clearInterval(atual.relogio);
    atual=null;
  }
  function fim(){
    const k=atual&&atual.k, dps=atual&&atual.aoFim;
    limpar();if(k)marcar(k);
    if(k==='lib'){try{setTimeout(goalOnEnter,600)}catch(e){}}
    if(k==='ler'){try{clearTimeout(R.hideT);R.lastAct=Date.now();R.hideT=setTimeout(()=>{if(R.open&&!STACK.length)setChrome(false)},2600)}catch(e){}}
    if(dps)try{dps()}catch(e){}
  }
  function repor(){if(atual)desenhar(atual.caixa,atual.passo,true)}

  /* no leitor a barra de cima se esconde sozinha; durante o tutorial ela fica */
  function segurarBarra(){
    if(!atual||atual.k!=='ler')return;
    try{clearTimeout(R.hideT);setChrome(true)}catch(e){}
  }

  /* espera o elemento aparecer na tela (o passo pode ter acabado de abrir uma aba) */
  function achar(sel,tentativas){
    return new Promise(res=>{
      let n=tentativas||1;
      const t=()=>{
        const el=sel?document.querySelector(sel):null;
        if(el){const r=el.getBoundingClientRect();if(r.width>1&&r.height>1)return res(el)}
        if(--n<=0)return res(null);
        setTimeout(t,160);
      };t();
    });
  }
  const dormir=ms=>new Promise(r=>setTimeout(r,ms));

  /* ---------------- desenho ---------------- */
  function desenhar(r,p,soRepor){
    const vw=innerWidth,vh=innerHeight;
    document.querySelectorAll('.tour-foco,.tour-pan,.tour-tampa').forEach(n=>n.remove());
    const pan=(l,t,w,h)=>{if(w<=0||h<=0)return;const d=document.createElement('div');d.className='tour-pan';
      d.style.left=l+'px';d.style.top=t+'px';d.style.width=w+'px';d.style.height=h+'px';document.body.append(d)};
    if(r){
      const m=8;
      const L=Math.max(0,r.left-m), T=Math.max(0,r.top-m);
      const Rt=Math.min(vw,r.right+m), B=Math.min(vh,r.bottom+m);
      pan(0,0,vw,T);                 /* em cima  */
      pan(0,B,vw,vh-B);              /* embaixo  */
      pan(0,T,L,B-T);                /* esquerda */
      pan(Rt,T,vw-Rt,B-T);           /* direita  */
      const f=document.createElement('div');f.className='tour-foco'+(p.acao?' pede':'');
      f.style.left=L+'px';f.style.top=T+'px';f.style.width=(Rt-L)+'px';f.style.height=(B-T)+'px';
      document.body.append(f);
      if(!p.acao){                   /* passo de leitura: nem o alvo aceita toque */
        const t2=document.createElement('div');t2.className='tour-tampa';
        t2.style.left=L+'px';t2.style.top=T+'px';t2.style.width=(Rt-L)+'px';t2.style.height=(B-T)+'px';
        document.body.append(t2);
      }
    }else{
      pan(0,0,vw,vh);
    }
    if(soRepor){posicionarBalao(r);return}
  }
  function posicionarBalao(r){
    const b=document.querySelector('.tour-bal');if(!b)return;
    const vw=innerWidth,vh=innerHeight,bw=b.offsetWidth,bh=b.offsetHeight;
    let bx=(vw-bw)/2, by=Math.max(10,(vh-bh)/2);
    if(r){
      const abaixo=r.bottom+18+bh<=vh-10;
      by=abaixo?r.bottom+18:Math.max(10,r.top-18-bh);
      if(!abaixo&&r.top-18-bh<10)by=Math.min(vh-bh-10,r.bottom+18);
      bx=Math.min(Math.max(10,r.left+r.width/2-bw/2),vw-bw-10);
    }
    b.style.left=Math.round(bx)+'px';b.style.top=Math.round(by)+'px';
  }

  async function passo(){
    const meu=++token;
    if(!atual)return;
    if(atual.i>=atual.lista.length)return fim();
    const p=atual.lista[atual.i];
    atual.passo=p;
    if(p.antes){try{p.antes()}catch(e){}}
    segurarBarra();

    /* acha o alvo, rola até ele e mede de novo */
    let el=null;
    if(p.alvo){
      el=await achar(p.alvo, p.esperar?18:6);
      if(meu!==token||!atual)return;
      if(!el){atual.i++;return passo()}            /* alvo não existe: pula o passo */
      try{el.scrollIntoView({block:'center',inline:'nearest',behavior:'auto'})}catch(e){}
      await dormir(260);
      if(meu!==token||!atual)return;
      const r0=el.getBoundingClientRect();
      if(!(r0.width>1&&r0.height>1)){atual.i++;return passo()}
    }
    atual.el=el;
    const r=el?el.getBoundingClientRect():null;
    atual.caixa=r;

    document.querySelectorAll('.tour-bal').forEach(n=>n.remove());
    desenhar(r,p);

    const ultimo=atual.i===atual.lista.length-1;
    const b=document.createElement('div');b.className='tour-bal';
    b.innerHTML=`<div class="lin">${astro(p.pose||'acenando',76)}<div style="flex:1;min-width:0">
        <h4>${esc(p.t)}</h4><p>${esc(p.d)}</p></div></div>
      <div class="tour-pe">
        <button class="tour-skip" data-skip>Pular</button>
        <div class="tour-pt">${atual.lista.map((_,k)=>`<i class="${k===atual.i?'on':''}"></i>`).join('')}</div>
        ${p.acao?`<span class="tour-toque"><i></i>Toque no que está aceso</span>`
                :`<button class="btn btn-primary btn-sm tour-prox" data-prox disabled><span class="carga"></span><span class="rot">Aguarde 2</span></button>`}
      </div>`;
    document.body.append(b);
    posicionarBalao(r);
    b.querySelector('[data-skip]').onclick=()=>fim();

    if(p.acao){
      /* passo de toque: o usuário tem que clicar no alvo para seguir */
      const segue=()=>{if(meu!==token)return;el.removeEventListener('click',segue,true);atual.i++;setTimeout(()=>passo(),420)};
      el.addEventListener('click',segue,true);
      return;
    }
    /* espera antes de liberar o Próximo */
    const ms=p.espera||ESPERA;
    const bt=b.querySelector('[data-prox]'), carga=b.querySelector('.carga'), rot=b.querySelector('.rot');
    const t0=Date.now();
    if(atual.relogio)clearInterval(atual.relogio);
    /* rel guarda o proprio intervalo, para parar mesmo depois do tutorial fechar */
    const rel=atual.relogio=setInterval(()=>{
      if(meu!==token)return clearInterval(rel);
      const d=Date.now()-t0, f=Math.min(1,d/ms);
      carga.style.width=(f*100)+'%';
      const falta=Math.ceil((ms-d)/1000);
      if(f>=1){clearInterval(rel);atual.relogio=null;bt.disabled=false;carga.style.width='100%';
        rot.textContent=ultimo?'Entendi':'Próximo';}
      else rot.textContent='Aguarde '+Math.max(1,falta);
    },100);
    bt.addEventListener('click',()=>{
      if(bt.disabled||meu!==token)return;
      if(p.depois)try{p.depois()}catch(e){}
      if(atual.i>=atual.lista.length-1)return fim();
      atual.i++;passo();
    });
  }

  function comecar(k,lista,aoFim){
    if(atual||feito(k)||window.__semTutorial)return;
    const cap=document.createElement('div');cap.className='tour-cap';document.body.append(cap);
    atual={k,lista,i:0,aoFim};
    travar();
    window.addEventListener('resize',repor);
    if(k==='ler')atual.tim=setInterval(segurarBarra,900);
    passo();
  }

  /* só abre quando a tela está livre: nada de balão por cima de outra janela */
  function quandoLivre(fn,tentativas=45){
    const livre=()=>!document.querySelector('.sheet,.scrim,.paywall,.achpop,.cele,.intro,.goalsheet,#paywall');
    const t=()=>{if(livre())return fn();if(--tentativas>0)setTimeout(t,900)};
    setTimeout(t,900);
  }

  function estante(){if(window.__semTutorial||!S.pid||feito('lib'))return;quandoLivre(()=>comecar('lib',ESTANTE))}
  function leitura(){if(window.__semTutorial||!S.pid||feito('ler'))return;quandoLivre(()=>comecar('ler',LEITURA))}
  /* chamada pela ficha do dicionário na primeira consulta */
  function ficha(){
    if(window.__semTutorial||!S.pid||feito('dic')||atual)return;
    setTimeout(()=>{if(!atual&&document.querySelector('#dSave'))comecar('dic',FICHA)},900);
  }
  function rever(){
    LS.set(chave('lib'),false);LS.set(chave('ler'),false);LS.set(chave('dic'),false);
    toast('Tutorial ligado de novo. Ele aparece na estante e ao abrir um livro.','ok',4000);
    if(!$('#lib').hidden)estante();
  }
  const pendente=k=>!!S.pid&&!window.__semTutorial&&!feito(k);
  const rodando=()=>!!atual;
  return{estante,leitura,ficha,rever,fim:limpar,pendente,rodando};
})();

/* ================= quiz do caderno: treinar as palavras do próprio livro ================= */
const QUIZ=(()=>{
  const chave=()=>'astra.quiz.'+S.pid;
  const placar=()=>LS.get(chave(),{});
  const VIDAS=3;

  /* o significado que vale como resposta certa */
  function sentido(w){
    if(w.simple&&w.simple.length>8)return w.simple;
    if(w.def&&w.def.length>8)return w.def;
    if(w.defs&&w.defs[0]&&w.defs[0].itens&&w.defs[0].itens[0])return w.defs[0].itens[0];
    return '';
  }
  const curto=s=>{s=String(s||'').trim().replace(/\s+/g,' ');return s.length>120?s.slice(0,118).replace(/[ ,;:.]+$/,'')+'…':s};

  /* monta as perguntas: a resposta certa e as erradas saem de palavras reais,
     nunca de significado inventado */
  function montar(){
    const v=vocab().filter(w=>sentido(w));
    if(v.length<4)return null;
    const baralho=v.slice().sort(()=>Math.random()-.5).slice(0,10);
    return baralho.map(w=>{
      const outras=v.filter(x=>fold(x.w)!==fold(w.w)).sort(()=>Math.random()-.5).slice(0,3);
      const certa=curto(sentido(w));
      const ops=[{t:certa,ok:true}].concat(outras.map(x=>({t:curto(sentido(x)),ok:false,de:x.w})));
      return {w,ops:ops.sort(()=>Math.random()-.5)};
    });
  }

  function abrir(){
    const perguntas=montar();
    if(!perguntas){
      toast('Guarde pelo menos 4 palavras no caderno para o quiz abrir.','ok',3600);
      try{reviewWords()}catch(e){}
      return;
    }
    let i=0, acertos=0, vidas=VIDAS;
    const {el,close}=openSheet(`<div class="sheet-h"><h3>Treinar palavras</h3><button class="icon-btn" data-close aria-label="Fechar">${ic('close')}</button></div><div class="sheet-b" id="qz"></div>`,
      {onClose:()=>{if(S.pid&&!$('#lib').hidden)renderLib()}});
    const B=$('#qz',el);

    const corações=()=>`<div class="qvidas">${[0,1,2].map(n=>`<span class="${n<vidas?'on':''}">${ic('star',n<vidas?'fill':'')}</span>`).join('')}</div>`;

    function guardar(w,ok){
      const p=placar();const k=fold(w.w);
      const r=p[k]||{acertos:0,erros:0};
      ok?r.acertos++:r.erros++;r.quando=Date.now();p[k]=r;LS.set(chave(),p);
    }

    function fimDeJogo(motivo){
      B.innerHTML=`<div class="qfim">${astro(acertos>=perguntas.length/2?'comemorando':'joia',120,'float')}
        <b>${acertos} de ${perguntas.length}</b>
        <span>${motivo==='vidas'?'As três vidas acabaram, mas o que você viu já ficou. Tente de novo quando quiser.':
          acertos===perguntas.length?'Acertou todas. Essas palavras já são suas.':'Cada rodada fixa um pouco mais. Volte amanhã com as palavras novas.'}</span>
        <div class="row" style="justify-content:center;gap:8px;margin-top:14px">
          <button class="btn btn-primary btn-sm" id="qzDe">Jogar de novo</button>
          <button class="btn btn-ghost btn-sm" id="qzFlash">Ver como ficha</button>
        </div></div>`;
      $('#qzDe',B).onclick=()=>{close();setTimeout(abrir,260)};
      $('#qzFlash',B).onclick=()=>{close();setTimeout(()=>{try{reviewWords()}catch(e){}},260)};
    }

    function carta(){
      if(vidas<=0)return fimDeJogo('vidas');
      if(i>=perguntas.length)return fimDeJogo('fim');
      const q=perguntas[i];
      B.innerHTML=`<div class="qtopo"><span class="label">${i+1} de ${perguntas.length}</span>${corações()}</div>
        <div class="qperg"><span>O que significa</span><b>${esc(q.w.w)}</b></div>
        ${q.w.ctx?`<div class="wctx">“${esc(curto(q.w.ctx))}”</div>`:''}
        <div class="qops">${q.ops.map((o,n)=>`<button class="qop" data-n="${n}">${esc(o.t)}</button>`).join('')}</div>
        <div class="qresp" hidden></div>`;
      const resp=$('.qresp',B);
      B.querySelectorAll('.qop').forEach(bt=>bt.onclick=()=>{
        if(B.dataset.feito)return;B.dataset.feito='1';
        const o=q.ops[+bt.dataset.n], certo=o.ok;
        B.querySelectorAll('.qop').forEach((x,n)=>{x.disabled=true;
          if(q.ops[n].ok)x.classList.add('certa');else if(x===bt)x.classList.add('errada')});
        if(certo)acertos++;else vidas--;
        guardar(q.w,certo);
        resp.hidden=false;
        resp.className='qresp '+(certo?'ok':'nao');
        resp.innerHTML=`<b>${certo?'Isso mesmo.':'Não é essa.'}</b>
          <span>${esc(q.w.w)}: ${esc(curto(sentido(q.w)))}</span>
          ${!certo&&o.de?`<small>O que você marcou é o significado de “${esc(o.de)}”.</small>`:''}
          <button class="btn btn-primary btn-sm" id="qzNext">${i>=perguntas.length-1?'Ver o resultado':'Próxima'}</button>`;
        $('#qzNext',resp).onclick=()=>{i++;delete B.dataset.feito;carta()};
        $('.qtopo .qvidas',B).outerHTML=corações();
      });
    }
    carta();
  }
  const podeJogar=()=>vocab().filter(w=>sentido(w)).length>=4;
  return{abrir,podeJogar,placar};
})();

/* ---------- layout & pagination ---------- */
async function layout(textOffset){
  const sw=stage.clientWidth,sh=stage.clientHeight;const pad=sw<900?0:18;

async function paginate(){

  const body=$('.tp-body',m);const H=body.clientHeight;const P=R.paras;const pages=[];let cur=[];
  const fits=()=>body.scrollHeight<=H+1;
  const mk=(pi,s,e)=>{const p=document.createElement('p');p.className='f'+(P[pi].h?' h':'')+(s>0?' fc':'')+(e<P[pi].t.length?' split':'');p.textContent=P[pi].t.slice(s,e);return p};

/* mede cada pedaco de texto invisivel e estica ele ate ter a mesma largura que o

function esticarSpans(tl,divs,items,escala,vpt){
  try{
    if(!tl||!divs||!divs.length||!items)return;

    const pares=[];let k=0;

      if(!it.str||!it.width)continue;
      const t=d.style.transform||'';
      if(/rotate|matrix/.test(t))continue;              // texto girado: deixa como o pdf.js fez
      d.style.transform='';

      // calculo que desenhou a imagem da pagina

        if(Math.abs(m[1])<1e-4)d.style.left=m[4].toFixed(2)+'px';}

function openAI(text,ctx){

  const prompt=mode==='word'?
`Você é o dicionário inteligente de um app de leitura. Responda em português do Brasil.
Palavra selecionada: "${word}"
Frase em que aparece: "${ctx.sentence||word}"
${bookRef()}
Responda SOMENTE com um objeto JSON, sem nenhum texto fora dele, neste formato:
{"lema":"forma de dicionário da palavra","classe":"classe gramatical curta, ex.: adjetivo","silabas":"divisão silábica com a sílaba tônica em maiúsculas, ex.: e-FÊ-me-ro","no_contexto":"o que a palavra quer dizer nesta frase, em 1 ou 2 frases simples","definicao":"definição geral de dicionário, em 1 ou 2 frases","sinonimos":[{"termo":"sinônimo já flexionado para caber na frase (mesmo gênero, número e tempo verbal)","encaixa":true,"nota":"nuance em até 6 palavras"}],"antonimos":["até 4 antônimos"],"exemplo":"uma frase nova de exemplo usando a palavra","origem":"etimologia em 1 frase curta, ou string vazia se não tiver certeza"}

Trecho selecionado: "${text.slice(0,2500)}"
Contexto ao redor: "${(ctx.around||'').slice(0,2400)}"
${bookRef()}
Responda SOMENTE com um objeto JSON, sem nenhum texto fora dele:
{"explicacao":"o que o trecho quer dizer, 2 a 4 frases","em_outras_palavras":"paráfrase curta e simples do trecho","termos":[{"termo":"palavra ou expressão difícil do trecho","significado":"explicação curta"}]}
Inclua até 5 termos; use lista vazia se não houver termos difíceis.`;

function voice(){try{const v=speechSynthesis.getVoices();return v.find(x=>/pt[-_]BR/i.test(x.lang))||v.find(x=>/^pt/i.test(x.lang))}catch(e){return null}}
function speak(text,onend){
  if(!('speechSynthesis' in window)){toast('Seu navegador não tem leitura em voz alta.','err');return}
  const gen=++R.ttsGen;speechSynthesis.cancel();
  const parts=[];let cur='';for(const s of (text.replace(/\s+/g,' ').match(/[^.!?…;:]+[.!?…;:]*\s*/g)||[]).map(x=>x.trim()).filter(Boolean)){if((cur+' '+s).length>220&&cur){parts.push(cur);cur=s}else cur=cur?cur+' '+s:s}if(cur)parts.push(cur);
  let k=0;const next=()=>{if(gen!==R.ttsGen)return;if(k>=parts.length){onend&&onend();return}const u=new SpeechSynthesisUtterance(parts[k++]);u.lang='pt-BR';const v=voice();if(v)u.voice=v;u.rate=S.set.rate||1;u.onend=next;u.onerror=()=>{};speechSynthesis.speak(u)};next();
}

  if(!t&&R.type==='pdf'){try{const pg=await R.pdf.getPage(R.idx+1);R.ptext[R.idx]=pdfText(await pg.getTextContent());t=R.ptext[R.idx]}catch(e){}}
  const after=()=>{if(!R.tts)return;if(R.idx<R.count-1){turn(1).then(()=>setTimeout(readCurrent,380))}else{R.tts=false;ttsBtn()}};

    else if(t==='words'){
      const v=vocab().slice().reverse();
      pane.innerHTML=`<div class="dlist">${v.length?v.map(w=>`<div class="ditem" style="cursor:default"><span class="t">${esc(w.w)}</span><span class="s">${esc(w.simple||w.def||'')}</span><span class="pn" style="max-width:110px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(w.book||'')}</span></div>`).join(''):'<div class="dempty">Aqui ficam as palavras que você não entendeu.<br>Segure uma palavra no texto e toque em Dicionário: ela é guardada sozinha.</div>'}</div>`;
    }
  }
  async function search(q){
    const gen=++srchGen;const res=$('#dres',pane);q=q.trim();if(q.length<2){res.innerHTML='<div class="dempty">Digite pelo menos 2 letras.</div>';return}
    const fq=fold(q);const hits=[];
    const scan=(i,txt)=>{const f=fold(txt);let p=f.indexOf(fq),n=0;while(p>=0&&n<3){hits.push({i,s:txt.slice(Math.max(0,p-50),p),m:txt.slice(p,p+q.length),e:txt.slice(p+q.length,p+q.length+70)});p=f.indexOf(fq,p+fq.length);n++}};
    if(R.type==='text'){for(let i=0;i<R.count&&hits.length<300;i++)scan(i,pageText(i))}
    else{for(let i=0;i<R.count&&hits.length<300;i++){if(R.ptext[i]==null){if(i%8===0)res.innerHTML=`<div class="dempty">Lendo página ${i+1} de ${R.count}…</div>`;try{const pg=await R.pdf.getPage(i+1);R.ptext[i]=pdfText(await pg.getTextContent())}catch(e){R.ptext[i]=''}if(gen!==srchGen)return}scan(i,R.ptext[i].replace(/\s+/g,' '))}}
    if(gen!==srchGen)return;
    res.innerHTML=hits.length?`<div class="label" style="padding:4px 12px 8px">${hits.length}${hits.length>=300?'+':''} resultado${hits.length>1?'s':''}</div>`+hits.map(h=>item(h.i,`…${esc(h.s)}<mark>${esc(h.m)}</mark>${esc(h.e)}…`,'',false)).join(''):`<div class="dempty">Nada encontrado para “${esc(q)}”.${R.type==='pdf'?'<br>Se o PDF for escaneado (imagem), ele não tem texto pesquisável.':''}</div>`;
  }
  el.addEventListener('click',e=>{const t=e.target.closest('[data-t]');if(t){render(t.dataset.t);return}const g=e.target.closest('[data-go]');if(g){close();goTo(+g.dataset.go)}});
  render(tab);
}

/* ---------- settings ---------- */
function openSettings(){
  const s=S.set;
  const {el}=openSheet(`<div class="sheet-h"><h3>Aparência e leitura</h3><button class="icon-btn" data-close aria-label="Fechar">${ic('close')}</button></div><div class="sheet-b">
    <div class="set-grp"><div class="label">Tema</div><div class="themes" style="margin-bottom:20px">
      ${[['paper','Papel','#fff','#17181c'],['sepia','Sépia','#F5EBD6','#3A2E21'],['dim','Cinza','#23262E','#D8DAE0'],['night','Noite','#000','#EDEDED']].map(([k,l,bg,fg])=>`<button data-theme-k="${k}" class="${s.theme===k?'on':''}" style="background:${bg};color:${fg};${k==='night'?'box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)':''}" aria-label="Tema ${l}">Aa<span>${l}</span></button>`).join('')}</div></div>
    <div class="set-grp"><div class="label">Brilho</div><input type="range" class="slider" id="sBr" min="30" max="100" value="${Math.round(s.bright*100)}" aria-label="Brilho" style="--v:${(s.bright*100-30)/70*100}%"></div>
    ${R.type==='text'?`
    <div class="set-grp"><div class="label">Fonte</div><div class="seg">${[['lit','Literata'],['man','Manrope'],['geo','Georgia']].map(([k,l])=>`<button data-font="${k}" class="${s.font===k?'on':''}" style="font-family:${FONTS[k]}">${l}</button>`).join('')}</div></div>
    <div class="set-grp"><div class="label">Tamanho da letra</div><div class="row" style="justify-content:space-between"><div class="stepper"><button class="icon-btn" data-fs="-1" aria-label="Diminuir letra"><b style="font-size:13px">A−</b></button><output id="sFs">${s.size}px</output><button class="icon-btn" data-fs="1" aria-label="Aumentar letra"><b style="font-size:18px">A+</b></button></div></div></div>
    <div class="set-grp"><div class="label">Espaçamento entre linhas</div><div class="seg">${[[1.42,'Justo'],[1.62,'Normal'],[1.9,'Amplo']].map(([v,l])=>`<button data-lh="${v}" class="${Math.abs(s.lh-v)<.01?'on':''}">${l}</button>`).join('')}</div></div>`:''}
    <div class="set-grp"><div class="label">Virada de página</div><div class="seg">${FLIPM.map(m=>[m[0],m[1]]).map(([k,l])=>`<button data-flip="${k}" class="${s.flip===k?'on':''}">${l}</button>`).join('')}</div></div>
    <button class="toggle ${s.lock?'on':''}" id="sLock" aria-pressed="${!!s.lock}"><div><b>Travar zoom entre páginas</b><small>Mantém o mesmo zoom e posição quando você vira a página. Ótimo para PDF com letra pequena.</small></div><span class="sw"></span></button>
    <div class="row"><button class="btn btn-ghost" id="sFull">${ic('expand')}Tela cheia</button></div>
  </div>`);
  let relT;const relayout=()=>{clearTimeout(relT);relT=setTimeout(()=>layout(R.pages[R.idx]?R.pages[R.idx].start:0),250)};
  el.addEventListener('click',e=>{
    const t=e.target.closest('[data-theme-k],[data-font],[data-fs],[data-lh],[data-flip]');
    if(t){
      if(t.dataset.themeK){s.theme=t.dataset.themeK;if(R.b){R.b.theme=s.theme;saveBook(R.b)}applyTheme();$$('[data-theme-k]',el).forEach(b=>b.classList.toggle('on',b===t))}
      if(t.dataset.font){s.font=t.dataset.font;$$('[data-font]',el).forEach(b=>b.classList.toggle('on',b===t));applyTheme();relayout()}
      if(t.dataset.fs){s.size=clamp(s.size+ +t.dataset.fs,13,32);$('#sFs',el).textContent=s.size+'px';applyTheme();relayout()}
      if(t.dataset.lh){s.lh=+t.dataset.lh;$$('[data-lh]',el).forEach(b=>b.classList.toggle('on',b===t));applyTheme();relayout()}
      if(t.dataset.flip){setFlipMode(t.dataset.flip);$$('[data-flip]',el).forEach(b=>b.classList.toggle('on',b===t));setTimeout(()=>turnDemo(),150)}
      saveSet();return;
    }
    if(e.target.closest('#sLock')){toggleLock();const b=$('#sLock',el);b.classList.toggle('on',!!s.lock);b.setAttribute('aria-pressed',!!s.lock)}
    if(e.target.closest('#sTts')){$('#rTts').click();return}
    if(e.target.closest('#sFull')){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>toast('Tela cheia não é permitida aqui.','err'))}catch(_){toast('Tela cheia não é permitida aqui.','err')}}
  });
  $('#sBr',el).addEventListener('input',e=>{s.bright=e.target.value/100;e.target.style.setProperty('--v',(e.target.value-30)/70*100+'%');applyTheme();saveSet()});
}
async function turnDemo(){if(R.flip||S.set.flip==='none'||R.idx>=R.count-1)return;if(!startFlip(1,R.ph*.96))return;const f=R.flip;await animF({x:f.W*.25,y:f.H*.72});await animF({x:f.C.x,y:f.C.y});showStatic()}


/* ---------- tipo de virada: simples / médio / 3D ---------- */
const FLIPM=[['none','Simples','Toca e já muda de página. O mais leve, ideal para aparelhos que travam.'],['slide','Médio','A página desliza de lado, acompanhando o dedo.'],['3d','3D','A folha dobra como papel de verdade. O mais bonito, pede mais do aparelho.']];
function setFlipMode(k){S.set.flip=k;S.set.flipU=1;saveSet();updFlipBtn()}
function updFlipBtn(){const b=$('#rFlip');if(!b)return;const i=FLIPM.findIndex(m=>m[0]===(S.set&&S.set.flip));b.dataset.lv=String(Math.max(0,i));b.setAttribute('aria-label','Virada de página: '+(FLIPM[i]||FLIPM[0])[1])}
function toggleFlipPick(){
  if($('#flpick')){$('#flpick').remove();return}
  const b=$('#rFlip').getBoundingClientRect();const d=document.createElement('div');d.id='flpick';d.className='hlpick flpick';
  d.innerHTML=`<div class="label">Virada de página</div>${FLIPM.map(([k,l,t],i)=>`<button class="flopt ${S.set.flip===k?'on':''}" data-fk="${k}"><span class="lv">${'<i></i>'.repeat(i+1)}</span><span><b>${l}</b><small>${t}</small></span></button>`).join('')}`;
  d.style.width='280px';d.style.top=(b.bottom+10)+'px';d.style.left=Math.max(8,Math.min(innerWidth-288,b.left+b.width/2-140))+'px';
  d.addEventListener('pointerdown',e=>e.stopPropagation());
  d.addEventListener('click',e=>{const o=e.target.closest('[data-fk]');if(!o)return;setFlipMode(o.dataset.fk);d.remove();toast('Virada: '+FLIPM.find(m=>m[0]===o.dataset.fk)[1]+'.','ok',1600);setTimeout(()=>turnDemo(),200)});
  RD.append(d);setTimeout(()=>document.addEventListener('pointerdown',function f(ev){if(!d.contains(ev.target)&&!ev.target.closest('#rFlip')){d.remove()}document.removeEventListener('pointerdown',f,true)},true),0);
}
$('#rFlip').onclick=toggleFlipPick;updFlipBtn();
/* ---------- wiring ---------- */
$('#rBack').onclick=closeReader;$('#rHl').onclick=toggleHlMode;$('#rSearch').onclick=()=>openDrawer('search');$('#rToc').onclick=()=>openDrawer('toc');$('#rMark').onclick=toggleMark;$('#rSet').onclick=openSettings;
$('#rPrev').onclick=()=>turn(-1);$('#rNext').onclick=()=>turn(1);
const sc=$('#scrub');
sc.addEventListener('input',()=>{$('#footMini').textContent=`Ir para ${sc.value} / ${R.count}`;$('#rPage').textContent=`Página ${sc.value} de ${R.count}`;sc.style.setProperty('--v',(R.count>1?(sc.value-1)/(R.count-1)*100:100)+'%')});
sc.addEventListener('change',()=>goTo(sc.value-1));
RD.addEventListener('pointerdown',()=>{R.lastAct=Date.now()},true);
setInterval(()=>{if(R.open&&!document.hidden&&(Date.now()-R.lastAct<120000||R.tts)){const st=getStats();const k=dayKey();st.days[k]=(st.days[k]||0)+5;LS.set(statKey(),st);try{readTick()}catch(e){console.error(e)}}},5000);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&R.open&&R.b)saveBook(R.b)});

window.__astraBack=()=>{if(STACK.length){STACK[STACK.length-1]();return true}if(hasSel()){clearSel();return true}if(R.open){closeReader();return true}return false};
/* ================= boot ================= */
if(window.pdfjsLib){try{pdfjsLib.GlobalWorkerOptions.workerSrc='pdf.worker.min.js'}catch(e){}}
initCaps();
(async()=>{if(typeof CLOUD!=='undefined'&&CLOUD.on)return CLOUD.boot();if(profiles().length)renderPicker();else renderAuth()})();

try{window.__astra=window.__astra||{};window.__astra.sel=()=>SEL.range?SEL.range.toString():null;window.__abrirDict=(w)=>openDict(w,'');window.__astra.hit=(x,y)=>hitAt(x,y);window.__astra.dedos=()=>({dedos:PT.size,gesto:G?G.mode:null,virando:!!R.flip});
window.__astra.esticar=()=>{const t=bookEl.querySelector('.textLayer');if(!t||!t._divs)return null;esticarSpans(t,t._divs,t._items,t._esc);return t.dataset.estica};
window.__astra.erroCamada=()=>{const t=bookEl.querySelector('.textLayer');if(!t||!t._divs)return null;
  const amp=(t.getBoundingClientRect().width||1)/(t.offsetWidth||1);let k=0,pior=0,soma=0,n=0,desl=0;const U=(window.pdfjsLib&&pdfjsLib.Util)||null;
  for(const it of t._items){if(it.str===undefined)continue;const d=t._divs[k++];if(!d||!d.isConnected||!it.str||!it.width)continue;
    const r=d.getBoundingClientRect(),alvo=it.width*t._esc,real=r.width/(amp||1);if(!(alvo>1)||!(real>1))continue;
    const e=Math.abs(real-alvo)/alvo;soma+=e;n++;if(e>pior)pior=e;
    if(U&&t._vpt&&it.transform){const m=U.transform(t._vpt,it.transform);if(Math.abs(m[1])<1e-4){
      const espX=(r.left-t.getBoundingClientRect().left)/(amp||1);const dx=Math.abs(espX-m[4]);if(dx>desl)desl=dx}}}
  return {pior:+(pior*100).toFixed(2),media:n?+(soma/n*100).toFixed(2):0,desloc:+desl.toFixed(2),pedacos:n}}}catch(e){}
})();
