<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://securetoken.googleapis.com https://identitytoolkit.googleapis.com; frame-src https://accounts.google.com https://*.firebaseapp.com;">
<meta name="referrer" content="no-referrer">
<title>Astra Book</title>
<meta name="theme-color" content="#05060A">
<link rel="stylesheet" href="fonts/fonts.css">
<script src="pdf.min.js"></script>
<script src="jszip.min.js"></script>
<script src="firebase-config.js"></script>
<script src="ads-config.js"></script>
<script src="firebase.js"></script>
<style>
:root{
  --bg:#05060A;--bg2:#0A0C13;--card:#0F121B;--glass:rgba(16,20,30,.68);--glass2:rgba(255,255,255,.045);
  --line:rgba(255,255,255,.085);--line2:rgba(255,255,255,.16);
  --ink:#EEF1F8;--mute:#959CB2;--dim:#5E657B;
  --plasma:#6EF3D6;--plasma-ink:#022019;--acc:110,243,214;--ion:#9AAEFF;--ember:#FFB36B;--rose:#FF8FB1;--danger:#FF6B7A;
  --r-sm:10px;--r:16px;--r-lg:26px;
  --ff-d:"Unbounded",system-ui,sans-serif;
  --ff:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ff-r:"Literata",Georgia,"Times New Roman",serif;
  --ff-m:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ff);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--plasma);outline-offset:2px;border-radius:8px}
.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.fill{fill:currentColor}
[hidden]{display:none!important}
.ovl{position:relative;overflow:hidden;cursor:pointer}
.fileov{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;z-index:2;-webkit-appearance:none;appearance:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===== cosmos ===== */
#cosmos{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.screen{position:fixed;inset:0;z-index:1;overflow-y:auto;overflow-x:hidden;padding-top:var(--safe-area-inset-top,env(safe-area-inset-top,0px));padding-bottom:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px))}
.screen[hidden]{display:none!important}
.ovl{position:relative;overflow:hidden;cursor:pointer}
.fileov{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;z-index:2;-webkit-appearance:none;appearance:none}
.screen.enter{animation:screenIn .6s var(--ease) both}
@keyframes screenIn{from{opacity:.2;transform:scale(.985) translateY(10px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}

/* ===== buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:48px;padding:0 22px;border-radius:14px;font-weight:700;letter-spacing:.01em;transition:transform .2s var(--ease),box-shadow .3s,background .3s,border-color .3s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--plasma);color:var(--plasma-ink);box-shadow:0 0 0 1px rgba(var(--acc),.6),0 10px 40px -10px rgba(var(--acc),.65)}
.btn-primary:hover{box-shadow:0 0 0 1px rgba(var(--acc),.9),0 14px 50px -8px rgba(var(--acc),.85)}
.btn-ghost{background:var(--glass2);border:1px solid var(--line2);color:var(--ink)}
.btn-ghost:hover{border-color:rgba(var(--acc),.5);background:rgba(var(--acc),.07)}
.btn-sm{height:38px;padding:0 14px;border-radius:11px;font-size:13.5px}
.btn-block{width:100%}
.icon-btn{width:42px;height:42px;border-radius:13px;display:inline-grid;place-items:center;color:inherit;transition:background .2s,transform .2s var(--ease),color .2s;position:relative}
.icon-btn:hover{background:rgba(127,127,127,.14)}
.icon-btn:active{transform:scale(.92)}
.icon-btn.on{color:var(--plasma)}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--line2);font-size:12.5px;font-weight:600;color:var(--mute);white-space:nowrap;transition:all .2s}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:hover:not(.on){color:var(--ink);border-color:rgba(255,255,255,.3)}
.label{font-family:var(--ff-m);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.field{display:grid;gap:6px}
.field label{font-size:12.5px;font-weight:600;color:var(--mute)}
.input{height:48px;border-radius:13px;border:1px solid var(--line2);background:rgba(255,255,255,.035);padding:0 15px;outline:none;transition:border-color .2s,box-shadow .2s;width:100%;min-width:0}
.input:focus{border-color:var(--plasma);box-shadow:0 0 0 4px rgba(var(--acc),.14)}

/* ===== logo ===== */
.brand{display:inline-flex;align-items:center;gap:10px;font-family:var(--ff-d);font-weight:700;letter-spacing:.2em;font-size:15px}
.brand svg{width:34px;height:34px;overflow:visible}
.brand i{font-style:normal;font-weight:400;opacity:.36;margin-left:.35em;letter-spacing:.24em}
.logo-anim .orbit{transform-origin:32px 34px;animation:orbitSpin 9s linear infinite}
@keyframes orbitSpin{to{transform:rotate(360deg)}}

/* ===== AUTH ===== */
#auth{display:grid;place-items:center;padding-inline:20px}
.auth-wrap{width:100%;max-width:1120px;display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;padding-block:40px}
.auth-hero h1{font-family:var(--ff-d);font-weight:700;font-size:clamp(34px,5.4vw,66px);line-height:1.02;letter-spacing:-.02em;margin:26px 0 18px;text-wrap:balance}
.auth-hero h1 em{font-style:normal;background:linear-gradient(100deg,var(--plasma),var(--ion) 55%,var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent}
.auth-hero p{color:var(--mute);font-size:17px;max-width:46ch;margin:0}
.feat{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.feat span{font-size:12.5px;color:var(--ink);padding:7px 12px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.scene{height:300px;perspective:1300px;display:grid;place-items:center;margin-top:12px}
.b3d{width:170px;height:250px;position:relative;transform-style:preserve-3d;animation:bookFloat 7s ease-in-out infinite}
@keyframes bookFloat{0%,100%{transform:rotateY(-32deg) rotateX(10deg) translateY(0)}50%{transform:rotateY(-12deg) rotateX(4deg) translateY(-14px)}}
.b3d>div{position:absolute;inset:0;border-radius:4px 10px 10px 4px}
.b3d .fr{transform:translateZ(18px);background:#0B0F1C;overflow:hidden;box-shadow:inset 3px 0 0 rgba(255,255,255,.08)}
.b3d .fr::before{content:"";position:absolute;inset:-50%;background:conic-gradient(from 0deg,transparent,rgba(var(--acc),.55),transparent 30%,rgba(154,174,255,.5),transparent 60%,rgba(255,143,177,.45),transparent 85%);animation:holo 6s linear infinite;mix-blend-mode:screen}
@keyframes holo{to{transform:rotate(360deg)}}
.b3d .fr .ttl{position:absolute;left:18px;right:18px;bottom:22px;font-family:var(--ff-d);font-weight:700;font-size:21px;line-height:1.05;letter-spacing:.02em}
.b3d .fr .ttl small{display:block;font-family:var(--ff-m);font-weight:400;font-size:9px;letter-spacing:.2em;color:rgba(255,255,255,.7);margin-bottom:8px}
.b3d .fr .ring{position:absolute;width:150px;height:150px;left:10px;top:24px;border:1px solid rgba(255,255,255,.35);border-radius:50%}
.b3d .fr .ring.r2{width:90px;height:90px;left:40px;top:54px;border-color:rgba(var(--acc),.7)}
.b3d .bkc{transform:translateZ(-18px) rotateY(180deg);background:#0A0D18}
.b3d .sp{width:36px!important;left:-18px!important;transform:rotateY(-90deg);background:linear-gradient(90deg,#070a13,#141a2c);border-radius:3px!important}
.b3d .pgc{width:34px!important;left:auto!important;right:-17px!important;top:5px!important;bottom:5px!important;transform:rotateY(90deg);background:repeating-linear-gradient(90deg,#d9dce4 0 1px,#f4f5f8 1px 3px)}
.scene .glow{position:absolute;width:260px;height:40px;border-radius:50%;background:radial-gradient(rgba(var(--acc),.35),transparent 70%);transform:translateY(160px);filter:blur(6px);animation:glowP 7s ease-in-out infinite}
@keyframes glowP{50%{transform:translateY(160px) scale(.8);opacity:.6}}
.auth-card{background:var(--glass);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--line2);border-radius:var(--r-lg);padding:30px;display:grid;gap:18px;position:relative;overflow:hidden}
.auth-card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(140deg,rgba(var(--acc),.55),transparent 35%,transparent 65%,rgba(154,174,255,.45));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.auth-card h2{font-family:var(--ff-d);font-size:20px;font-weight:500;margin:0}
.auth-card .sub{color:var(--mute);font-size:13.5px;margin:-10px 0 0}
.boot-auth{min-height:100%;display:grid;place-items:center;padding:28px;text-align:center}
.boot-auth>div{display:grid;justify-items:center;gap:14px}.boot-auth img{width:116px;height:116px;object-fit:contain;filter:drop-shadow(0 14px 28px rgba(110,243,214,.25));animation:bookFloat 4s ease-in-out infinite}
.boot-auth p{margin:0;color:var(--mute);font-size:13px}.boot-dots{display:flex;gap:7px}.boot-dots i{width:7px;height:7px;border-radius:50%;background:var(--plasma);animation:bootDot 1.2s ease-in-out infinite}.boot-dots i:nth-child(2){animation-delay:.15s}.boot-dots i:nth-child(3){animation-delay:.3s}@keyframes bootDot{50%{opacity:.25;transform:translateY(-4px)}}
.profiles{display:flex;flex-wrap:wrap;gap:10px}
.prof{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:99px;border:1px solid var(--line2);background:rgba(255,255,255,.03);transition:all .25s var(--ease)}
.prof:hover{border-color:var(--plasma);transform:translateY(-2px)}
.ava{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#061015;flex:none;background-size:cover;background-position:center}
.or{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.note{font-size:12px;color:var(--dim);margin:0;line-height:1.5}
.claude-btn{background:#F4EFE6;color:#1c1917}
.claude-btn:hover{box-shadow:0 10px 40px -12px rgba(244,239,230,.6)}

/* ===== LIBRARY ===== */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 20px;background:linear-gradient(var(--bg) 30%,rgba(5,6,10,.0));}
.topbar::before{content:"";position:absolute;inset:0;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);mask:linear-gradient(#000 60%,transparent);-webkit-mask:linear-gradient(#000 60%,transparent);z-index:-1}
.search{flex:1;max-width:520px;margin-left:auto;display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);transition:border-color .2s,background .2s}
.search:focus-within{border-color:rgba(var(--acc),.6);background:rgba(var(--acc),.05)}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;height:100%}
.search .i{color:var(--mute)}
.me{border-radius:50%;padding:3px;border:1px solid var(--line2)}
.lib-main{width:100%;max-width:1200px;margin:0 auto;padding-inline:20px;padding-block:6px 120px;display:grid;gap:34px;min-width:0}
.greet{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.greet h1{font-family:var(--ff-d);font-weight:500;font-size:clamp(26px,4vw,40px);letter-spacing:-.01em;margin:6px 0 0;line-height:1.1;text-wrap:balance;max-width:100%;overflow-wrap:anywhere}
.greet h1 b{font-weight:700;color:var(--plasma)}
.hero-row{display:grid;grid-template-columns:1.55fr 1fr;gap:18px}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:var(--r-lg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);position:relative;overflow:hidden}
.cont{display:grid;grid-template-columns:auto 1fr;gap:28px;padding:26px;align-items:center;min-height:260px}
.cont>.astro{justify-self:center}
.cont .bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(50px) saturate(1.5);opacity:.35;z-index:-1;transform:scale(1.2)}
.tilt{perspective:900px;position:relative}
.cover3d{width:150px;aspect-ratio:2/3;border-radius:4px 10px 10px 4px;position:relative;transform-style:preserve-3d;transition:transform .5s var(--ease);box-shadow:-18px 26px 40px -12px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.06)}
.cover3d img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.cover3d::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,rgba(0,0,0,.35) 0,rgba(255,255,255,.18) 3%,transparent 7%,transparent 92%,rgba(0,0,0,.18));pointer-events:none}
.cover3d .shine{position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at var(--mx,30%) var(--my,20%),rgba(255,255,255,.35),transparent 45%);mix-blend-mode:overlay;opacity:0;transition:opacity .3s;pointer-events:none}
.tilt:hover .shine{opacity:1}
.cont h2{font-family:var(--ff-d);font-weight:700;font-size:clamp(20px,2.6vw,28px);line-height:1.12;margin:8px 0 4px;text-wrap:balance}
.cont .au{color:var(--mute);margin:0 0 18px}
.prog{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.prog .track{flex:1;height:6px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.prog .track i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--plasma),var(--ion));box-shadow:0 0 16px rgba(var(--acc),.6)}
.prog span{font-family:var(--ff-m);font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.stats{padding:22px;display:grid;gap:16px;align-content:start}
.ringrow{display:flex;align-items:center;gap:18px}
.ring{width:96px;height:96px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--ff-d);font-weight:700;font-size:22px;line-height:1}
.ring .num small{display:block;font-family:var(--ff-m);font-weight:400;font-size:10px;color:var(--mute);margin-top:3px;letter-spacing:.08em}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1}
.kpi b{display:block;font-family:var(--ff-d);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--mute)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:74px}
.week div{display:grid;gap:6px;justify-items:center;height:100%;grid-template-rows:1fr auto}
.week i{width:100%;max-width:26px;align-self:end;border-radius:6px 6px 3px 3px;background:rgba(255,255,255,.09);min-height:4px;transition:height .8s var(--ease)}
.week i.hit{background:linear-gradient(var(--plasma),rgba(var(--acc),.35));box-shadow:0 0 14px rgba(var(--acc),.35)}
.week i.today{outline:1px solid var(--plasma);outline-offset:2px}
.week span{font-family:var(--ff-m);font-size:10px;color:var(--dim)}
.shelf-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.shelf-head h2{font-family:var(--ff-d);font-weight:500;font-size:20px;margin:0}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.sel{height:34px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line2);padding:0 10px;outline:none}
.sel option{background:#10131c}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:30px 20px}
.bk{display:grid;gap:10px;position:relative;animation:rise .7s var(--ease) both}
@keyframes rise{from{opacity:.3;transform:translateY(18px)}to{opacity:1;transform:none}}
.bk .tilt{justify-self:stretch}
.bk .cover3d{width:100%}
.bk-open{display:block;width:100%;border-radius:4px 10px 10px 4px}
.bk-meta{display:grid;grid-template-columns:1fr auto;gap:2px 6px;align-items:start}
.bk-meta h3{font-size:14px;font-weight:700;margin:0;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bk-meta p{grid-column:1;margin:0;font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-meta .icon-btn{grid-row:1/3;grid-column:2;width:34px;height:34px;margin-top:-4px;color:var(--mute)}
.bk .bar{height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.bk .bar i{display:block;height:100%;background:var(--plasma)}
.badge{position:absolute;top:8px;left:8px;z-index:2;font-family:var(--ff-m);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;padding:4px 7px;border-radius:6px;background:rgba(5,6,10,.72);backdrop-filter:blur(6px);border:1px solid var(--line2)}
.badge.done{color:var(--plasma)}
.fav{position:absolute;top:8px;right:8px;z-index:2;color:var(--ember);filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
.drop{border:1.5px dashed rgba(var(--acc),.45);border-radius:10px;aspect-ratio:2/3;display:grid;place-items:center;align-content:center;gap:10px;text-align:center;color:var(--mute);font-size:13px;padding:14px;background:radial-gradient(circle at 50% 40%,rgba(var(--acc),.08),transparent 70%);transition:all .3s var(--ease)}
.drop:hover,.drop.over{border-color:var(--plasma);color:var(--ink);background:radial-gradient(circle at 50% 40%,rgba(var(--acc),.18),transparent 70%);transform:translateY(-3px)}
.drop .plus{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:rgba(var(--acc),.12);color:var(--plasma);box-shadow:0 0 30px rgba(var(--acc),.25)}
.drop b{color:var(--ink);font-size:14px}
.empty{padding:40px 20px;text-align:center;color:var(--mute);grid-column:1/-1}
.fab{position:fixed;right:18px;bottom:calc(18px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)));z-index:30;width:60px;height:60px;border-radius:20px;background:var(--plasma);color:var(--plasma-ink);display:none;place-items:center;box-shadow:0 12px 40px -6px rgba(var(--acc),.7)}
.dragcover{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(5,6,10,.75);backdrop-filter:blur(10px);font-family:var(--ff-d);font-size:22px;color:var(--plasma);border:2px dashed var(--plasma);margin:12px;border-radius:28px;pointer-events:none}

/* ===== sheets / menus ===== */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(3,4,8,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:50%;bottom:0;z-index:81;width:min(600px,100%);max-height:88%;display:flex;flex-direction:column;background:#0E1119;border:1px solid var(--line2);border-bottom:0;border-radius:26px 26px 0 0;box-shadow:0 -30px 80px -20px rgba(0,0,0,.7);transform:translateX(-50%);animation:sheetUp .45s var(--ease) both;padding-bottom:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px));color:var(--ink)}
@keyframes sheetUp{from{transform:translate(-50%,100%)}}
.sheet.out{animation:sheetDown .3s ease-in both}
@keyframes sheetDown{to{transform:translate(-50%,100%)}}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:rgba(255,255,255,.18);margin:10px auto 0;flex:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 22px 8px;flex:none}
.sheet-h h3{margin:0;font-family:var(--ff-d);font-weight:500;font-size:18px}
.sheet-b{overflow-y:auto;overflow-x:hidden;padding:8px 22px 24px;display:grid;gap:18px;overscroll-behavior:contain;min-width:0;max-width:100%}
.menu{display:grid;gap:2px;padding:6px 10px 16px}
.menu button{display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:13px;text-align:left;font-weight:600;transition:background .2s}
.menu button:hover{background:rgba(255,255,255,.06)}
.menu button.danger{color:var(--danger)}
.menu button .i{color:var(--mute)}
.menu button.danger .i{color:var(--danger)}
.edit-top{display:grid;grid-template-columns:120px 1fr;gap:20px;align-items:start}
.edit-top .cover3d{width:120px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.cov-opt{width:54px;aspect-ratio:2/3;border-radius:3px 7px 7px 3px;overflow:hidden;border:2px solid transparent;transition:transform .2s var(--ease),border-color .2s}
.cov-opt img{width:100%;height:100%;object-fit:cover;display:block}
.cov-opt:hover{transform:translateY(-3px)}
.cov-opt.on{border-color:var(--plasma)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>.input{flex:1}
.toast-wrap{position:fixed;left:50%;top:calc(16px + var(--safe-area-inset-top,env(safe-area-inset-top,0px)));transform:translateX(-50%);z-index:200;display:grid;gap:8px;justify-items:center;pointer-events:none;width:calc(100% - 32px);max-width:440px}
.toast{background:rgba(16,20,30,.92);backdrop-filter:blur(14px);border:1px solid var(--line2);border-radius:14px;padding:11px 16px;font-size:13.5px;font-weight:600;display:flex;gap:10px;align-items:center;animation:toastIn .45s var(--spring) both;box-shadow:0 16px 40px -10px rgba(0,0,0,.6);color:var(--ink)}
.toast .i{color:var(--plasma)}
.toast.err .i{color:var(--danger)}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px) scale(.96)}}
.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid rgba(var(--acc),.2);border-top-color:var(--plasma);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== READER ===== */
#reader{overflow:hidden;background:var(--stage);color:var(--c-ink);transition:background .5s;
  --stage:#E7E5E0;--paper:#FFFFFF;--pink:#17181C;--pmute:#6b6e78;--c-bg:rgba(250,250,248,.8);--c-ink:#15161A;--c-mute:#6D717C;--c-line:rgba(0,0,0,.09);--pfilter:none;--hl-blend:multiply;--edge:rgba(0,0,0,.22)}
#reader[data-theme="sepia"]{--stage:#DDCFB6;--paper:#F5EBD6;--pink:#3A2E21;--pmute:#8b775d;--c-bg:rgba(245,235,214,.82);--c-ink:#3A2E21;--c-mute:#8b775d;--c-line:rgba(58,46,33,.12);--pfilter:sepia(.42) saturate(1.15) brightness(.97);--hl-blend:multiply}
#reader[data-theme="dim"]{--flapsh:rgba(255,255,255,.14);--stage:#15171C;--paper:#23262E;--pink:#EDEFF4;--pmute:#8a8f9c;--c-bg:rgba(24,27,34,.82);--c-ink:#E1E3E9;--c-mute:#8a8f9c;--c-line:rgba(255,255,255,.08);--pfilter:invert(.9) hue-rotate(180deg) contrast(1.15) brightness(1.05);--hl-blend:screen;--edge:rgba(0,0,0,.5)}
#reader[data-theme="night"]{--flapsh:rgba(255,255,255,.22);--stage:#000;--paper:#000;--pink:#F7F7F7;--pmute:#8b8b8b;--c-bg:rgba(10,10,12,.84);--c-ink:#F1F1F1;--c-mute:#8b8b8b;--c-line:rgba(255,255,255,.1);--pfilter:invert(1) hue-rotate(180deg) contrast(1.35) brightness(1.1);--hl-blend:screen;--edge:rgba(255,255,255,.06)}
.r-bar{position:absolute;left:0;right:0;z-index:30;background:var(--c-bg);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);transition:transform .45s var(--ease),opacity .35s;color:var(--c-ink)}
.r-top{top:0;border-bottom:1px solid var(--c-line);padding:calc(6px + var(--safe-area-inset-top,env(safe-area-inset-top,0px))) 8px 6px;display:flex;align-items:center;gap:2px}
.r-top .ttl{flex:1;min-width:0;padding:0 8px}
.r-top .ttl b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-top .ttl span{display:block;font-size:11.5px;color:var(--c-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-bottom{bottom:0;border-top:1px solid var(--c-line);padding:10px 14px calc(10px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)));display:grid;gap:6px}
.r-bottom .row{flex-wrap:nowrap;gap:6px}
.r-bottom .meta{display:flex;justify-content:space-between;font-family:var(--ff-m);font-size:11.5px;color:var(--c-mute);font-variant-numeric:tabular-nums;padding:0 6px;gap:10px}
#reader.chrome-off .r-top{transform:translateY(-105%);opacity:0;pointer-events:none}
#reader.chrome-off .r-bottom{transform:translateY(105%);opacity:0;pointer-events:none}
#reader.chrome-off .zoom-hud:not(.zoomed){opacity:0;pointer-events:none;transform:translateX(20px)}
.scrub{flex:1;-webkit-appearance:none;appearance:none;height:28px;background:transparent;min-width:0}
.scrub::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--plasma) var(--v,0%),var(--c-line) var(--v,0%))}
.scrub::-moz-range-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--plasma) var(--v,0%),var(--c-line) var(--v,0%))}
.scrub::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--plasma);margin-top:-8px;box-shadow:0 0 0 5px rgba(var(--acc),.22),0 2px 10px rgba(0,0,0,.3)}
.scrub::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:var(--plasma);box-shadow:0 0 0 5px rgba(var(--acc),.22)}
.stage{position:absolute;left:0;right:0;top:var(--safe-area-inset-top,env(safe-area-inset-top,0px));bottom:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px));z-index:1;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overflow:visible}
.zw{position:absolute;inset:0;transform-origin:50% 50%;display:grid;place-items:center}
/* enquanto o dedo esta na tela, avisa o navegador para manter a pagina numa camada propria:
   o movimento vira so composicao, sem repintar o conteudo do livro a cada quadro */
/* so a folha que vira ganha camada propria. a .zw carrega a camada de texto do PDF,
   e promove-la muda o arredondamento das medidas e estraga a selecao de palavra */
#reader.mexendo .flap,#reader.mexendo .leaf{will-change:transform}
.book{position:relative;transform-style:preserve-3d;perspective:2200px}
.tp-body,.textLayer{user-select:text;-webkit-user-select:text}
.book::before{content:"";position:absolute;inset:0;box-shadow:0 30px 60px -20px var(--edge),0 0 0 1px var(--c-line);border-radius:3px;pointer-events:none}
.pg{position:absolute;inset:0;background:var(--paper);overflow:hidden;border-radius:2px 4px 4px 2px}
.pg canvas{position:absolute;inset:0;width:100%;height:100%;filter:var(--pfilter);display:block}
.pg .ph{position:absolute;inset:0;display:grid;place-items:center}
.textLayer span.markedContent{top:0;height:0}
.textLayer{text-align:initial;position:absolute;left:0;top:0;overflow:hidden;line-height:1;text-size-adjust:none;-webkit-text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;z-index:2;opacity:1}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%}
.textLayer .endOfContent{display:block;position:absolute;inset:100% 0 0;z-index:-1;cursor:default;user-select:none}
.stage ::selection{background:rgba(var(--acc),.42);color:inherit}
.stage .textLayer ::selection{color:transparent}
.hl-layer{position:absolute;inset:0;z-index:1;pointer-events:none;mix-blend-mode:var(--hl-blend)}
.hl-layer i{position:absolute;border-radius:2px}
.hc-plasma{--hc:rgba(var(--acc),.55)}.hc-ember{--hc:rgba(255,179,107,.6)}.hc-ion{--hc:rgba(154,174,255,.55)}.hc-rose{--hc:rgba(255,143,177,.55)}
.hl-layer i{background:var(--hc)}
mark.hl{background:var(--hc);color:inherit;border-radius:2px;padding:0 .5px;mix-blend-mode:var(--hl-blend)}
mark.hl.noted{box-shadow:inset 0 -2px 0 var(--pink)}
.tpage{position:absolute;inset:0;display:flex;flex-direction:column;color:var(--pink);font-family:var(--tf,var(--ff-r));font-size:var(--ts,19px);line-height:var(--tl,1.62);padding:var(--tpad,44px 40px 18px)}
.tp-body{flex:1;overflow:hidden;hyphens:auto;-webkit-hyphens:auto}
.tp-body .f{margin:0;text-align:justify;text-indent:1.6em;overflow-wrap:break-word}
.tp-body .f+.f{margin-top:.28em}
.tp-body .f.fc{text-indent:0}
.tp-body .f.split{text-align-last:justify}
.tp-body .f.h{text-indent:0;text-align:left;font-family:var(--ff-d);font-weight:500;font-size:1.15em;line-height:1.25;letter-spacing:-.005em;margin:.4em 0 1em;text-wrap:balance}
.tp-body .f.h:first-child{margin-top:1.2em}
.tp-body .f.h::before{content:"";display:block;width:36px;height:3px;border-radius:3px;background:var(--plasma);margin-bottom:.9em}
.tp-foot{flex:none;height:26px;display:flex;justify-content:space-between;align-items:flex-end;font-family:var(--ff-m);font-size:11px;color:var(--pmute);letter-spacing:.04em}
.tp-foot span:first-child{max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leaf{position:absolute;inset:0;transform-origin:0 50%;transform-style:preserve-3d;z-index:3}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;border-radius:2px 4px 4px 2px}
.face.back{transform:rotateY(180deg);background:var(--paper)}
.face.back::after{content:"";position:absolute;inset:0;background:linear-gradient(270deg,rgba(0,0,0,.18),transparent 30%,transparent 85%,rgba(0,0,0,.08))}
.face .pg{position:absolute}
.gloss{position:absolute;inset:0;pointer-events:none;z-index:5;opacity:0;background:linear-gradient(90deg,rgba(0,0,0,.0) 0%,rgba(0,0,0,.08) 55%,rgba(255,255,255,.22) 78%,rgba(0,0,0,.28) 100%)}
.under{position:absolute;inset:0;z-index:1}
.under{overflow:hidden}
.cfront{position:absolute;inset:0;z-index:2}
.flapw{position:absolute;inset:0;z-index:3;pointer-events:none;filter:drop-shadow(0 4px 14px var(--flapsh,rgba(0,0,0,.38)))}
.flap{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--paper);overflow:hidden}
.flap .mirror{opacity:.13;pointer-events:none}
.fbar{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;z-index:6}
.ush{background:linear-gradient(to top,rgba(0,0,0,.42),rgba(0,0,0,.12) 35%,transparent)}
.fgl{background:linear-gradient(to top,rgba(0,0,0,.22),rgba(255,255,255,.32) 18%,rgba(255,255,255,0) 60%)}
.sel-layer{position:absolute;inset:0;z-index:4;pointer-events:none;mix-blend-mode:var(--hl-blend)}
.sel-layer i{position:absolute;background:rgba(var(--acc),.5);border-radius:2px}
.shandle{position:fixed;z-index:58;width:30px;height:32px;margin-left:-15px;touch-action:none;cursor:grab}
.shandle::before{content:"";position:absolute;left:14px;top:calc(-1 * var(--h,20px));width:2px;height:var(--h,20px);background:var(--plasma)}
.shandle::after{content:"";position:absolute;left:5px;top:2px;width:20px;height:20px;border-radius:50%;background:var(--plasma);box-shadow:0 2px 8px rgba(0,0,0,.35);transition:transform .15s}
.shandle.drag::after{transform:scale(1.3)}
#reader.hl-mode .stage{cursor:text}
.under .shade{position:absolute;inset:0;z-index:6;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(0,0,0,.12) 40%,transparent 75%)}
.ribbon{position:absolute;top:-2px;right:22px;width:22px;height:46px;z-index:7;background:linear-gradient(var(--plasma),#3fd8b7);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);filter:drop-shadow(0 3px 4px rgba(0,0,0,.35));animation:ribbon .5s var(--spring) both;pointer-events:none}
@keyframes ribbon{from{transform:translateY(-100%)}}
.dimmer{position:absolute;inset:0;z-index:20;background:#000;pointer-events:none;opacity:0;transition:opacity .2s}
.foot-mini{position:absolute;left:0;right:0;bottom:calc(6px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)));text-align:center;font-family:var(--ff-m);font-size:11px;color:var(--c-mute);z-index:2;font-variant-numeric:tabular-nums;pointer-events:none}
.zoom-hud{position:absolute;right:12px;top:50%;transform:translateY(-50%);z-index:31;display:grid;gap:2px;padding:6px;border-radius:18px;background:var(--c-bg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--c-line);transition:opacity .35s,transform .45s var(--ease);color:var(--c-ink);justify-items:center}
.zoom-hud .pct{font-family:var(--ff-m);font-size:10.5px;color:var(--c-mute);padding:2px 0;font-variant-numeric:tabular-nums}
.zoom-hud .icon-btn{width:38px;height:38px}
.zoom-hud .lock.on{background:var(--plasma);color:var(--plasma-ink)}
.zoom-hud .lock.on:hover{background:var(--plasma)}
.r-loading{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:14px;z-index:40;color:var(--c-mute);font-size:13px;background:var(--stage)}
.selbar{position:fixed;z-index:60;display:flex;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 16px);align-items:center;gap:2px;padding:5px;border-radius:16px;background:#10131C;color:#EEF1F8;border:1px solid rgba(255,255,255,.14);box-shadow:0 18px 50px -10px rgba(0,0,0,.6);animation:pop .3s var(--spring) both}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.94)}}
.selbar .icon-btn{width:40px;height:40px;color:#EEF1F8}
.selbar .ai{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:12px;font-weight:700;font-size:13.5px;background:linear-gradient(120deg,rgba(var(--acc),.22),rgba(154,174,255,.22));color:#fff}
.selbar .sep{width:1px;height:24px;background:rgba(255,255,255,.12);margin:0 3px}
.dot{width:22px;height:22px;border-radius:50%;background:var(--hc);border:2px solid rgba(255,255,255,.25)}
.dotb{width:32px;height:40px;display:grid;place-items:center;border-radius:10px}
.dotb:hover{background:rgba(255,255,255,.08)}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:81;width:min(420px,92vw);background:#0E1119;border-left:1px solid var(--line2);display:flex;flex-direction:column;animation:drawerIn .45s var(--ease) both;padding-top:var(--safe-area-inset-top,env(safe-area-inset-top,0px));padding-bottom:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px));color:var(--ink)}
@keyframes drawerIn{from{transform:translateX(100%)}}
.drawer.out{animation:drawerOut .3s ease-in both}
@keyframes drawerOut{to{transform:translateX(100%)}}
.dtabs{display:flex;gap:4px;padding:6px 14px 10px;overflow-x:auto;scrollbar-width:none;flex:none;border-bottom:1px solid var(--line)}
.dtabs::-webkit-scrollbar{display:none}
.dlist{overflow-y:auto;padding:10px 12px 30px;display:grid;gap:4px;align-content:start;flex:1;overscroll-behavior:contain}
.ditem{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:11px 12px;border-radius:12px;text-align:left;transition:background .2s;width:100%}
.ditem:hover{background:rgba(255,255,255,.05)}
.ditem .t{font-size:14px;font-weight:600;line-height:1.35}
.ditem .s{font-size:12.5px;color:var(--mute);line-height:1.45;grid-column:1}
.ditem .pn{font-family:var(--ff-m);font-size:11px;color:var(--mute);grid-row:1/3;grid-column:2}
.ditem.cur{background:rgba(var(--acc),.08)}
.ditem.cur .t{color:var(--plasma)}
.ditem mark{background:rgba(var(--acc),.3);color:inherit;border-radius:3px}
.ditem .q{border-left:3px solid var(--hc);padding-left:10px;font-family:var(--ff-r);font-size:14px;line-height:1.5}
.dempty{padding:40px 16px;text-align:center;color:var(--mute);font-size:13.5px;line-height:1.6}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.seg button{height:38px;border-radius:10px;font-size:13px;font-weight:600;color:var(--mute);transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--ink);color:var(--bg)}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.themes button{border-radius:14px;height:64px;display:grid;place-items:center;font-family:var(--ff-r);font-size:18px;border:2px solid transparent;transition:all .25s var(--ease);position:relative}
.themes button span{position:absolute;bottom:-20px;left:0;right:0;font-family:var(--ff);font-size:11.5px;color:var(--mute)}
.themes button.on{border-color:var(--plasma);box-shadow:0 0 0 4px rgba(var(--acc),.15)}
.set-grp{display:grid;gap:10px}
.set-grp>.label{margin-bottom:2px}
.slider{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent}
.slider::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--plasma) var(--v,50%),rgba(255,255,255,.1) var(--v,50%))}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;margin-top:-8px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.slider::-moz-range-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--plasma) var(--v,50%),rgba(255,255,255,.1) var(--v,50%))}
.slider::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:#fff}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);text-align:left;width:100%}
.toggle b{display:block;font-size:14px}
.toggle small{display:block;font-size:12px;color:var(--mute);line-height:1.4;margin-top:2px}
.sw{width:46px;height:28px;border-radius:99px;background:rgba(255,255,255,.14);position:relative;flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .3s var(--spring)}
.toggle.on .sw{background:var(--plasma)}
.toggle.on .sw::after{transform:translateX(18px)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper output{min-width:56px;text-align:center;font-family:var(--ff-m);font-size:13px}

/* ===== AI sheet ===== */
.ai-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.ai-word{font-family:var(--ff-d);font-weight:700;font-size:30px;letter-spacing:-.01em;line-height:1.05;background:linear-gradient(100deg,#fff,var(--plasma));-webkit-background-clip:text;background-clip:text;color:transparent}
.ai-cls{font-family:var(--ff-m);font-size:11.5px;color:var(--ion);letter-spacing:.06em}
.ai-card{border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line);padding:14px 16px;display:grid;gap:8px}
.ai-card p{margin:0;line-height:1.6;font-size:14.5px}
.ai-card .quote{font-family:var(--ff-r);font-size:16px;line-height:1.6;color:#dfe3ee}
.ai-card .quote b{color:var(--plasma);font-weight:600;background:rgba(var(--acc),.12);border-radius:4px;padding:0 3px;transition:all .3s}
.ai-card .quote b.swap{animation:swap .5s var(--spring)}
@keyframes swap{from{transform:scale(.8);opacity:.2}}
.syns{display:flex;flex-wrap:wrap;gap:8px}
.syn{display:inline-flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 13px;border-radius:13px;border:1px solid var(--line2);background:rgba(255,255,255,.03);text-align:left;transition:all .2s var(--ease)}
.syn b{font-size:14.5px;font-weight:700}
.syn small{font-size:11px;color:var(--mute);max-width:22ch;line-height:1.3}
.syn.fit b::after{content:" ✓";color:var(--plasma);font-size:12px}
.syn:hover{border-color:rgba(var(--acc),.5)}
.syn.on{border-color:var(--plasma);background:rgba(var(--acc),.1);transform:translateY(-2px)}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(var(--acc),.14),rgba(255,255,255,.05));background-size:200% 100%;animation:shim 1.3s linear infinite}

.tour-bal .lin{display:flex;gap:12px;align-items:flex-start}

.tour-bal h4{font-family:var(--ff-d);font-weight:500;font-size:17px;margin:2px 0 6px;letter-spacing:-.01em}
.tour-bal p{margin:0;color:var(--mute);font-size:14.5px;line-height:1.55}
.tour-pe{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.tour-skip{color:var(--mute);font-size:12px;text-decoration:underline;text-underline-offset:3px}
.tour-pt{display:flex;gap:6px}
.tour-pt i{width:7px;height:7px;border-radius:50%;background:var(--line2)}
.tour-pt i.on{background:rgb(var(--acc));width:18px;border-radius:4px}
/* uma pausa curta evita toques acidentais; a barra mostra quanto falta */
.tour-prox{position:relative;overflow:hidden;min-width:112px}
.tour-prox[disabled]{opacity:.55}
.tour-prox .carga{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.22);
  pointer-events:none;transition:width .12s linear}
.tour-toque{font-size:13px;color:rgb(var(--acc));font-weight:600;display:flex;align-items:center;gap:6px}
.tour-toque i{width:8px;height:8px;border-radius:50%;background:rgb(var(--acc));animation:tourPulso 1.2s infinite}
@keyframes tourPulso{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
@media (prefers-reduced-motion: reduce){.tour-foco.pede,.tour-toque i{animation:none}}

/* ---- quiz do caderno ---- */
.qtopo{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.qvidas{display:flex;gap:5px}
.qvidas span{opacity:.22;color:var(--dim)}
.qvidas span.on{opacity:1;color:rgb(var(--acc))}
.qperg{display:grid;gap:4px;margin-bottom:10px}
.qperg span{font-size:13px;color:var(--mute)}
.qperg b{font-family:var(--ff-d);font-weight:500;font-size:26px;letter-spacing:-.02em}
.qops{display:grid;gap:9px;margin-top:14px}
.qop{text-align:left;padding:13px 14px;border-radius:14px;border:1px solid var(--line2);

.qop:not(:disabled):active{transform:scale(.99);border-color:rgb(var(--acc))}
.qop:disabled{opacity:.6}
.qop.certa{border-color:rgb(var(--acc));background:rgba(var(--acc),.14);opacity:1}
.qop.errada{border-color:#e2607a;background:rgba(226,96,122,.12);opacity:1}
.qresp{display:grid;gap:6px;margin-top:16px;padding:14px;border-radius:14px;border:1px solid var(--line2)}
.qresp.ok{border-color:rgba(var(--acc),.5);background:rgba(var(--acc),.08)}
.qresp.nao{border-color:rgba(226,96,122,.5);background:rgba(226,96,122,.08)}
.qresp b{font-size:15px}
.qresp span{font-size:14px;color:var(--mute);line-height:1.5}
.qresp small{font-size:12.5px;color:var(--dim)}
.qresp .btn{margin-top:8px;justify-self:start}
.qfim{display:grid;justify-items:center;text-align:center;gap:6px;padding:10px 0 4px}
.qfim b{font-family:var(--ff-d);font-weight:500;font-size:30px}
.qfim span{font-size:14px;color:var(--mute);max-width:32ch;line-height:1.5}
.accpick{margin-top:12px;display:grid;gap:8px}.accpick .row{flex-wrap:wrap;gap:8px}
.accsw{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:inherit;font-size:13.5px;font-weight:600}
.accsw i{width:16px;height:16px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.accsw.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}

<style>
/* faixa do plano e tela de planos */
.prostrip{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:18px;border:1px solid rgba(255,179,107,.3);background:linear-gradient(135deg,rgba(255,179,107,.14),rgba(255,143,177,.07))}
.prostrip>div{display:flex;align-items:center;gap:12px;flex:1;min-width:0;flex-wrap:wrap}

.pwx{position:absolute;right:10px;top:10px}

.pwc h2{font-family:var(--ff-d);font-size:22px;margin:0;line-height:1.25}.pwc p{margin:0;color:var(--mute);font-size:14.5px}
.pwperks{display:grid;gap:8px;justify-items:start;width:100%;margin:6px 0 2px}
.pwperks>div{display:flex;align-items:center;gap:10px;font-size:14px}.pwperks .i{width:18px;height:18px;color:rgb(var(--acc))}
.pwplans{display:grid;gap:10px;width:100%}
.pwplan{position:relative;display:grid;gap:2px;text-align:left;padding:14px 16px;border-radius:16px;border:1.5px solid var(--line2);background:rgba(255,255,255,.03);color:inherit}

<style>
/* playlists por categoria e central de importacao */
.pltemplates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pltemplate{display:grid;gap:7px;text-align:left;padding:8px;border:1px solid var(--line2);border-radius:16px;background:rgba(255,255,255,.035);color:inherit;transition:.2s}

.pltemplate img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:11px;background:#090b14}

.discord-hero{position:relative;overflow:hidden;display:grid;grid-template-columns:1fr 132px;gap:12px;align-items:end;padding:22px;border-radius:24px;background:radial-gradient(circle at 80% 15%,rgba(110,243,214,.24),transparent 35%),linear-gradient(145deg,#111936,#080a15 68%);border:1px solid rgba(154,174,255,.32)}
.discord-hero:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:27px 27px;opacity:.12;pointer-events:none}
.discord-hero>div{position:relative;z-index:1}.discord-hero img{position:relative;z-index:1;width:132px;max-height:175px;object-fit:contain;filter:drop-shadow(0 16px 22px rgba(0,0,0,.35))}
.discord-hero h3{font-family:var(--ff-d);font-size:24px;margin:4px 0 8px}.discord-hero p{margin:0;color:#cbd3ec;font-size:13.5px;line-height:1.55}.discord-hero .tag{display:inline-flex;padding:5px 9px;border-radius:99px;background:rgba(110,243,214,.12);color:#6EF3D6;font-size:10.5px;font-weight:800;letter-spacing:.08em}
.discord-perks{display:grid;gap:8px;margin:14px 0}.discord-perks div{display:flex;gap:9px;align-items:flex-start;color:var(--mute);font-size:13px}.discord-perks .i{width:17px;height:17px;color:#6EF3D6;flex:none}
.btn[aria-busy="true"]{opacity:.78;cursor:wait}.login-status{min-height:18px;text-align:center;color:var(--mute);font-size:12.5px}
@media(max-width:520px){.pltemplates{grid-template-columns:repeat(2,minmax(0,1fr))}.import-choices{grid-template-columns:1fr}.discord-hero{grid-template-columns:1fr 84px;padding:18px}.discord-hero h3{font-size:20px;line-height:1.13}.discord-hero img{width:88px;max-height:132px}}

const safeImg=(src,fallback=EMPTY_IMG)=>{const s=String(src||'').trim();return /^(?:data:image\/(?:png|jpe?g|webp|gif);base64,[a-z0-9+/=\r\n]+|blob:https?:\/\/[^\s"'<>]+|(?:astra|categories)\/[a-z0-9._/-]+)$/i.test(s)&&!s.includes('..')?s:fallback};

function sanitizeBook(raw){

  b.title=cleanText(b.title,140)||'Sem título';b.author=cleanText(b.author,90);b.series=cleanText(b.series,60);b.col=cleanText(b.col,40);b.fname=cleanText(b.fname,180);
  b.cover=safeImg(b.cover);if(b.coverOrig)b.coverOrig=safeImg(b.coverOrig,'');
  b.bookmarks=Array.isArray(b.bookmarks)?b.bookmarks.slice(0,5000).filter(x=>x&&typeof x==='object').map(x=>({id:cleanText(x.id,100)||'m_'+uid(),pos:Math.max(0,Number(x.pos)||0),at:Math.max(0,Number(x.at)||0),snip:cleanText(x.snip,240)})):[];

  b.highlights=Array.isArray(b.highlights)?b.highlights.slice(0,10000).filter(x=>x&&typeof x==='object').map(x=>{const h=Object.assign({},x);h.id=cleanText(h.id,100)||'h_'+uid();h.type=h.type==='p'?'p':'t';h.color=colors.has(h.color)?h.color:'sun';h.note=cleanText(h.note,2000);h.text=cleanText(h.text,10000);h.a=Math.max(0,Number(h.a)||0);h.b=Math.max(h.a,Number(h.b)||0);h.page=Math.max(0,Number(h.page)||0);if(h.type==='p')h.rects=Array.isArray(h.rects)?h.rects.slice(0,500).filter(r=>Array.isArray(r)&&r.length===4).map(r=>r.map(n=>clamp(Number(n)||0,0,1))):[];return h}):[];
  b.progress=clamp(Number(b.progress)||0,0,1);b.pos=Math.max(0,Number(b.pos)||0);b.seriesN=Math.max(0,Math.min(999,Number(b.seriesN)||0));b.opened=Math.max(0,Number(b.opened)||0);b.added=Math.max(0,Number(b.added)||Date.now());b.finished=!!b.finished;b.fav=!!b.fav;
  return b;
}

const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

const dayKey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fold=s=>{let o='';for(let i=0;i<s.length;i++){const c=s[i];let f=c.normalize('NFD')[0];f=f?f.toLowerCase():c;o+=f.length===1?f:c}return o};
const fmtDur=sec=>{sec=Math.max(0,Math.round(sec));const h=Math.floor(sec/3600),m=Math.round((sec%3600)/60);return h?`${h} h ${String(m).padStart(2,'0')} min`:`${Math.max(1,m)} min`};
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function toast(msg,kind='ok',ms=3200){

/* ================= storage (IndexedDB + fallback) ================= */
const DB=(()=>{
  let dbp=null;const mem={books:new Map(),blobs:new Map()};
  function open(){
    if(dbp)return dbp;
    dbp=new Promise(res=>{
      try{const r=indexedDB.open('astra-leitor',1);
        r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('books'))d.createObjectStore('books',{keyPath:'id'});if(!d.objectStoreNames.contains('blobs'))d.createObjectStore('blobs')};
        r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null);
        setTimeout(()=>res(null),4000);
      }catch(e){res(null)}
    });
    return dbp;
  }
  const memPut=(store,val,key)=>{store==='books'?mem.books.set(val.id,val):mem.blobs.set(key,val)};
  async function put(store,val,key){
    const d=await open();if(!d){memPut(store,val,key);return false}
    return new Promise(res=>{try{const t=d.transaction(store,'readwrite');store==='books'?t.objectStore(store).put(val):t.objectStore(store).put(val,key);
      t.oncomplete=()=>res(true);t.onerror=t.onabort=()=>{memPut(store,val,key);res(false)}}catch(e){memPut(store,val,key);res(false)}});
  }
  async function get(store,key){
    if(store==='blobs'&&mem.blobs.has(key))return mem.blobs.get(key);
    if(store==='books'&&mem.books.has(key))return mem.books.get(key);
    const d=await open();if(!d)return undefined;
    return new Promise(res=>{try{const r=d.transaction(store).objectStore(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>res(undefined)}catch(e){res(undefined)}});
  }
  async function del(store,key){
    mem.books.delete(key);mem.blobs.delete(key);
    const d=await open();if(!d)return;
    return new Promise(res=>{try{const t=d.transaction(store,'readwrite');t.objectStore(store).delete(key);t.oncomplete=()=>res(true);t.onerror=()=>res(false)}catch(e){res(false)}});
  }
  async function books(owner){
    const d=await open();let list=[];
    if(d)list=await new Promise(res=>{try{const r=d.transaction('books').objectStore('books').getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>res([])}catch(e){res([])}});
    const ids=new Set(list.map(b=>b.id));
    for(const b of mem.books.values())if(!ids.has(b.id))list.push(b);
    return list.filter(b=>b.owner===owner);
  }
  return{put,get,del,books};
})();

/* ================= cosmos background ================= */
(function cosmos(){
  const c=$('#cosmos'),x=c.getContext('2d');let w,h,stars=[],t=Math.random()*10,mx=.5,my=.5;
  function size(){const d=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0);
    stars=Array.from({length:Math.round(w*h/7000)},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.1+.25,s:Math.random()*.22+.03,t:Math.random()*6.28}))}
  addEventListener('pointermove',e=>{mx=e.clientX/w;my=e.clientY/h},{passive:true});
  function draw(){
    t+=.0035;x.clearRect(0,0,w,h);
    const R=Math.max(w,h)*.6;
    const blobs=[[.18+.08*Math.sin(t*1.3)+(mx-.5)*.04,.14+.06*Math.cos(t),(window.__acc||'110,243,214'),.17],[.86+.06*Math.cos(t*.9)-(mx-.5)*.04,.32+.08*Math.sin(t*1.1)+(my-.5)*.04,'154,174,255',.15],[.5+.12*Math.sin(t*.6),1.02,'255,143,177',.08]];
    for(const[bx,by,col,a]of blobs){const g=x.createRadialGradient(bx*w,by*h,0,bx*w,by*h,R);g.addColorStop(0,`rgba(${col},${a})`);g.addColorStop(1,`rgba(${col},0)`);x.fillStyle=g;x.fillRect(0,0,w,h)}
    x.fillStyle='#E4ECFF';
    for(const s of stars){s.y-=s.s;if(s.y<-2){s.y=h+2;s.x=Math.random()*w}s.t+=.018;x.globalAlpha=.25+.4*(.5+.5*Math.sin(s.t));x.beginPath();x.arc(s.x+(mx-.5)*s.r*8,s.y+(my-.5)*s.r*8,s.r,0,6.283);x.fill()}
    x.globalAlpha=1;
  }
  function loop(){if($('#reader').hidden&&!document.hidden)draw();if(!reduceMotion)requestAnimationFrame(loop)}
  size();addEventListener('resize',size);draw();loop();
})();

/* ================= sheets ================= */
const STACK=[];
function openSheet(html,{cls='',onClose,drawer=false}={}){
  const scrim=document.createElement('div');scrim.className='scrim';
  const sh=document.createElement('div');sh.className=(drawer?'drawer ':'sheet ')+cls;sh.setAttribute('role','dialog');sh.setAttribute('aria-modal','true');
  sh.innerHTML=(drawer?'':'<div class="grab"></div>')+html;
  document.body.append(scrim,sh);
  let closed=false;
  const close=()=>{if(closed)return;closed=true;const i=STACK.indexOf(close);if(i>=0)STACK.splice(i,1);
    sh.classList.add('out');scrim.style.transition='opacity .3s';scrim.style.opacity=0;setTimeout(()=>{sh.remove();scrim.remove();onClose&&onClose()},300)};
  scrim.addEventListener('click',close);
  sh.addEventListener('click',e=>{if(e.target.closest('[data-close]'))close()});
  if(!drawer){ // drag down to dismiss
    const grab=$('.grab',sh),head=$('.sheet-h',sh);let y0=null,dy=0;
    const down=e=>{y0=e.clientY;dy=0;sh.style.transition='none';e.currentTarget.setPointerCapture(e.pointerId)};
    const move=e=>{if(y0==null)return;dy=Math.max(0,e.clientY-y0);sh.style.transform=`translate(-50%,${dy}px)`};
    const up=()=>{if(y0==null)return;y0=null;sh.style.transition='transform .3s var(--ease)';if(dy>90){sh.style.transform='translate(-50%,100%)';setTimeout(close,10)}else sh.style.transform='translate(-50%,0)'};
    [grab,head].forEach(el=>{if(!el)return;el.addEventListener('pointerdown',e=>{if(e.target.closest('button,input'))return;down(e)});el.addEventListener('pointermove',move);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)});
  }
  STACK.push(close);
  return{el:sh,close};
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&STACK.length){e.preventDefault();e.stopImmediatePropagation();STACK[STACK.length-1]()}},true);

async function pdfPageImage(doc,n,width=420){
  const page=await doc.getPage(n);const vp1=page.getViewport({scale:1});const vp=page.getViewport({scale:width/vp1.width});

  await page.render({canvasContext:x,viewport:vp}).promise;return c.toDataURL('image/jpeg',.84);
}
function imgToData(src,maxW=520){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,maxW/im.naturalWidth);const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.86))};im.onerror=()=>rej(new Error('Imagem inválida'));im.src=src})}
const readBuf=f=>f.arrayBuffer?f.arrayBuffer():new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('Não consegui ler o arquivo.'));r.readAsArrayBuffer(f)});
const toBuf=x=>x instanceof ArrayBuffer?x.slice(0):(x&&x.arrayBuffer?x.arrayBuffer():new Response(x).arrayBuffer());

/* ================= parsing ================= */
function parseText(txt){
  txt=txt.replace(/\r\n?/g,'\n').replace(/\t/g,' ').replace(/ /g,' ');
  let blocks=txt.split(/\n\s*\n/);if(blocks.length<6)blocks=txt.split('\n');
  const out=[];
  for(let b of blocks){b=b.replace(/\s*\n\s*/g,' ').replace(/ {2,}/g,' ').trim();if(!b)continue;let h=false;
    if(/^#{1,3}\s+/.test(b)){b=b.replace(/^#{1,3}\s+/,'');h=true}
    else if(b.length<72&&(/^(cap[ií]tulo|parte|chapter|pr[oó]logo|ep[ií]logo|introdu[cç][aã]o|pref[aá]cio|antes de come[cç]ar)\b/i.test(b)||(b===b.toUpperCase()&&/\p{L}{3}/u.test(b)&&!/[.!?,;]$/.test(b))))h=true;
    out.push({t:b,h});}
  return out;
}
async function parseEpub(buf){
  if(!window.JSZip)throw new Error('O leitor de EPUB não carregou.');
  const zip=await JSZip.loadAsync(buf);const dp=new DOMParser();
  const cont=await zip.file('META-INF/container.xml')?.async('string');if(!cont)throw new Error('EPUB inválido.');
  const opfPath=dp.parseFromString(cont,'application/xml').querySelector('rootfile')?.getAttribute('full-path');if(!opfPath||!zip.file(opfPath))throw new Error('EPUB sem índice.');
  const opf=dp.parseFromString(await zip.file(opfPath).async('string'),'application/xml');
  const base=opfPath.includes('/')?opfPath.slice(0,opfPath.lastIndexOf('/')+1):'';
  const tag=n=>{const e=opf.getElementsByTagName(n)[0]||opf.getElementsByTagNameNS('*',n.split(':').pop())[0];return e?e.textContent.trim():''};
  const man={};for(const it of opf.getElementsByTagNameNS('*','item'))man[it.getAttribute('id')]={href:it.getAttribute('href'),type:it.getAttribute('media-type')||'',props:it.getAttribute('properties')||''};
  const resolve=href=>{const out=[];for(const p of (base+decodeURIComponent(href.split('#')[0])).split('/')){if(p==='..')out.pop();else if(p&&p!=='.')out.push(p)}return out.join('/')};
  const spine=[...opf.getElementsByTagNameNS('*','itemref')].map(r=>man[r.getAttribute('idref')]).filter(x=>x&&/html|xml/.test(x.type));
  const paras=[];const BLOCK=new Set(['p','li','blockquote','pre','dd','dt','figcaption','td']);
  const clean=s=>s.replace(/\s+/g,' ').trim();
  function walk(node){for(const ch of node.children){const t=ch.localName.toLowerCase();
    if(/^h[1-6]$/.test(t)){const s=clean(ch.textContent);if(s)paras.push({t:s,h:true})}
    else if(BLOCK.has(t)){const s=clean(ch.textContent);if(s)paras.push({t:s,h:false})}
    else if(['script','style','nav','head'].includes(t)){}
    else if(ch.querySelector('p,h1,h2,h3,h4,h5,h6,li,blockquote,div,section'))walk(ch);
    else{const s=clean(ch.textContent);if(s)paras.push({t:s,h:false})}}}
  for(const it of spine){const f=zip.file(resolve(it.href));if(!f)continue;const s=await f.async('string');
    let d=dp.parseFromString(s,'application/xhtml+xml');if(d.querySelector('parsererror'))d=dp.parseFromString(s,'text/html');const body=d.body||d.getElementsByTagName('body')[0];if(body)walk(body)}
  if(!paras.length)throw new Error('Não encontrei texto neste EPUB.');
  let cover=null;
  let cid=Object.keys(man).find(k=>man[k].props.includes('cover-image'));
  if(!cid){const m=[...opf.getElementsByTagNameNS('*','meta')].find(m=>m.getAttribute('name')==='cover');if(m)cid=m.getAttribute('content')}
  if(cid&&man[cid]&&/image/.test(man[cid].type)){const f=zip.file(resolve(man[cid].href));if(f){try{cover=await imgToData(`data:${man[cid].type};base64,`+await f.async('base64'),420)}catch(e){}}}
  let series='',seriesN=0;const metas=[...opf.getElementsByTagNameNS('*','meta')];
  const cs=metas.find(m=>m.getAttribute('name')==='calibre:series');if(cs){series=cs.getAttribute('content')||'';const ci=metas.find(m=>m.getAttribute('name')==='calibre:series_index');seriesN=ci?Math.round(+ci.getAttribute('content'))||0:0}
  if(!series){const bc=metas.find(m=>m.getAttribute('property')==='belongs-to-collection');if(bc){series=bc.textContent.trim();const id=bc.getAttribute('id');const gp=id&&metas.find(m=>m.getAttribute('property')==='group-position'&&m.getAttribute('refines')==='#'+id);seriesN=gp?Math.round(+gp.textContent)||0:0}}
  return{title:tag('dc:title'),author:tag('dc:creator'),paras,cover,series,seriesN};
}

function baseBook(name){return{id:'b_'+uid(),owner:S.pid,title:name.replace(/\.[^.]+$/,'').replace(/[_]+/g,' ').replace(/\s+/g,' ').trim()||'Sem título',author:'',added:Date.now(),opened:0,pos:0,progress:0,fav:false,finished:false,bookmarks:[],highlights:[],col:'',spp:0}}
async function importOne(f){
  if(!f||!Number.isFinite(f.size)||f.size<=0)throw new Error('O arquivo está vazio.');
  if(f.size>314572800)throw new Error('O arquivo passa do limite seguro de 300 MB.');
  const ext=(f.name.split('.').pop()||'').toLowerCase();
  const b=baseBook(f.name);b.size=f.size;
  if(ext==='pdf'||f.type==='application/pdf'){
    if(!window.pdfjsLib)throw new Error('O leitor de PDF não carregou. Verifique a conexão.');
    const buf=await readBuf(f);const doc=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise;
    try{const m=await doc.getMetadata();const ti=(m&&m.info&&m.info.Title||'').trim();const au=(m&&m.info&&m.info.Author||'').trim();if(ti&&ti.length>2&&!/^untitled|^microsoft|\.(doc|pdf)/i.test(ti))b.title=ti;if(au)b.author=au}catch(e){}
    b.type='pdf';b.fmt='PDF';b.pages=doc.numPages;
    b.cover=b.coverOrig=await pdfPageImage(doc,1,420);
    doc.destroy();
    const ok=await DB.put('blobs',buf,'f:'+b.id);b.volatile=!ok;
  }else if(ext==='epub'||f.type==='application/epub+zip'){
    const buf=await readBuf(f);const e=await parseEpub(buf);
    if(e.title)b.title=e.title;b.author=e.author||'';if(e.series){b.series=e.series;b.seriesN=e.seriesN||0}b.type='text';b.fmt='EPUB';b.words=e.paras.reduce((n,p)=>n+p.t.split(' ').length,0);
    b.cover=b.coverOrig=e.cover||await drawCover(b.title,b.author,STYLES[hash(b.title)%STYLES.length][0]);if(!e.cover)b.coverOrig=null;
    const ok=await DB.put('blobs',JSON.stringify(e.paras),'f:'+b.id);b.volatile=!ok;
  }else if(ext==='txt'||ext==='md'||/^text\//.test(f.type)){
    const raw=await readBuf(f);let txt=new TextDecoder('utf-8').decode(raw);if((txt.match(/\uFFFD/g)||[]).length>3){try{txt=new TextDecoder('windows-1252').decode(raw)}catch(e){}}const paras=parseText(txt);if(!paras.length)throw new Error('Arquivo vazio.');
    b.type='text';b.fmt='TXT';b.words=paras.reduce((n,p)=>n+p.t.split(' ').length,0);
    b.cover=await drawCover(b.title,'',STYLES[hash(b.title)%STYLES.length][0]);b.coverOrig=null;
    const ok=await DB.put('blobs',JSON.stringify(paras),'f:'+b.id);b.volatile=!ok;
  }else throw new Error('Formato não suportado. Use PDF, EPUB ou TXT.');
  await DB.put('books',b);
  return b;
}
async function importFiles(files){
  files=[...files];if(!files.length)return;
  let ok=0,last=null;
  for(const f of files){
    const done=toast(`Importando “${f.name}”…`,'load',0);
    try{const b=await importOne(f);S.books.push(b);ok++;last=b;if(b.volatile)toast('Sem espaço no navegador: este livro fica disponível só até fechar a página.','err',5000)}
    catch(e){console.error(e);toast(`Não consegui abrir “${f.name}”. ${e.message||''}`,'err',5000)}
    done();
  }
  if(ok){S.tab='all';S.q='';renderLib();toast(ok>1?`${ok} livros adicionados à estante.`:`“${last.title}” está na sua estante.`)}
}

/* ================= demo book ================= */
const DEMO=`# Bem-vindo ao Astra Book

Este é o seu primeiro livro, e ele é sobre o próprio lugar onde você está lendo. Folheie com calma: cada página ensina um recurso, e você pode testar tudo aqui mesmo, antes de trazer os seus livros.

O Astra nasceu de uma ideia simples: ler no celular não precisa parecer uma tela. Pode parecer um livro, com folhas que dobram, luz que muda com a noite e um companheiro que explica cada palavra difícil. Um pouco de papel, um pouco de futuro.

# Capítulo 1 — Folhas que obedecem ao seu dedo

Toque na borda direita para avançar e na esquerda para voltar, ou deslize o dedo para o lado. Um toque no meio mostra ou esconde toda a interface, e o livro fica em tela cheia, só você e o texto.

No botão 3D, lá em cima, você escolhe como a página vira. Simples troca na hora e é o mais leve. Médio faz a página deslizar acompanhando o dedo. 3D dobra a folha como papel de verdade: puxe pelo canto de baixo, pelo meio ou pelo canto de cima e solte antes da metade para ela voltar ao lugar.

Todo livro abre com as cores originais dele. No botão Aa ficam os temas: Papel, Sépia, Cinza e Noite, e cada livro lembra o tema que você escolheu para ele. No modo Noite o fundo fica preto e as letras brancas, com contraste reforçado para você enxergar cada detalhe mesmo no escuro.

# Capítulo 2 — Zoom que fica onde você deixou

Livros em PDF às vezes têm letra pequena. Afaste dois dedos na tela para aproximar e, quando encontrar o tamanho ideal, toque em Travar zoom.

A partir daí o zoom fica congelado: você só desliza para virar a página e cada nova página abre exatamente no mesmo enquadramento. Quer mudar? Dê dois toques na tela, toque no cadeado e o zoom destrava.

# Capítulo 3 — Um dicionário dentro do livro

Pressione e segure qualquer palavra e toque em Dicionário. Você vê o significado em palavras simples, a definição completa e sinônimos já ajustados à frase: no plural, no feminino ou no mesmo tempo do verbo. Toque num sinônimo e veja a frase reescrita na hora.

Teste agora com estas palavras: efêmero, inefável, vanguarda, prosaico, sinestesia. O dicionário já vem dentro do aplicativo e funciona sem internet. Toda palavra que você procura vai sozinha para o Meu dicionário, na tela inicial, onde dá para rever e revisar até decorar.

# Capítulo 4 — Marca-texto e notas

Ligue o marca-texto no topo, escolha a cor (o amarelo clássico está lá) e passe o dedo sobre o texto. Quando você solta, o trecho fica marcado e o marca-texto desliga sozinho. Errou? Toque em Desfazer, ou selecione o trecho marcado e toque em Remover marcação.

Toque num destaque para escrever uma nota. Tudo fica guardado na aba Destaques, junto com o sumário, a busca e os marcadores.

# Capítulo 5 — Seu universo de livros

Cada pessoa da casa tem o próprio perfil, com estante, progresso e metas separadas. Na tela inicial, é só escolher quem está lendo.

Monte playlists de livros como faria com músicas: Romance, Faculdade, Para ler nas férias. Um livro pode morar em várias playlists ao mesmo tempo, e cada uma ganha uma capa com os livros que ela guarda.

# Epílogo — O próximo capítulo é seu

Agora é com você. Toque em Importar, traga um PDF, um EPUB ou um TXT, e deixe o Astra transformar o arquivo em livro.

Boa leitura, e bem-vindo ao futuro.`;

const BUILTIN_BOOKS_V=3;
const LEGACY_BUILTIN_KEYS=new Set(['moreninha','luneta-magica','o-guarani','noite-na-taverna','a-divina-comedia','dom-casmurro','o-cortico']);
const LEGACY_BUILTIN_TITLES=new Set(['A Moreninha','A Luneta Mágica','O Guarani','Noite na Taverna','A Divina Comédia','Dom Casmurro','O Cortiço'].map(fold));
const BUILTIN_BOOKS=[];
const builtinSeedKey=()=>`astra.builtin.${BUILTIN_BOOKS_V}.`+S.pid;
async function removeLegacyBuiltinBooks(){
  const words=vocab();let wordsChanged=false;
  for(const w of words)if(LEGACY_BUILTIN_TITLES.has(fold(w.book||''))){w.book='';wordsChanged=true}
  if(wordsChanged)LS.set(vocKey(),words);
  const old=S.books.filter(b=>LEGACY_BUILTIN_KEYS.has(b.builtinKey));
  if(!old.length)return;
  const ids=new Set(old.map(b=>b.id));
  for(const b of old){await DB.del('books',b.id);await DB.del('blobs','f:'+b.id)}
  S.books=S.books.filter(b=>!ids.has(b.id));
  const list=playlists().map(pl=>({...pl,books:pl.books.filter(id=>!ids.has(id))})).filter(pl=>pl.books.length||!String(pl.id).startsWith('pl_builtin_'));
  savePls(list);
}
async function seedBuiltinBooks(){
  await removeLegacyBuiltinBooks();
  if(LS.get(builtinSeedKey(),false))return;
  let complete=true;const seeded=[];
  for(let i=0;i<BUILTIN_BOOKS.length;i++){
    const spec=BUILTIN_BOOKS[i];let b=S.books.find(x=>x.builtinKey===spec.key);
    if(!b){
      try{
        const res=await fetch(spec.file);if(!res.ok)throw new Error('HTTP '+res.status);
        const buf=await res.arrayBuffer();
        const doc=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise;
        b=baseBook(spec.title);Object.assign(b,{title:spec.title,author:spec.author,year:spec.year,genre:spec.genre,type:'pdf',fmt:'PDF',pages:doc.numPages,builtin:true,builtinKey:spec.key,publicDomain:true,added:Date.now()-5000+i});
        b.cover=spec.cover||await drawCover(spec.title,spec.author,spec.style||'orbit');b.coverOrig=b.cover;
        doc.destroy();
        const ok=await DB.put('blobs',buf,'f:'+b.id);if(!ok)throw new Error('Sem espaço para salvar o livro');
        await DB.put('books',b);S.books.push(b);
      }catch(err){console.error('Livro gratuito não instalado:',spec.title,err);complete=false;continue}
    }
    seeded.push({spec,b});
  }
  const list=playlists();let changed=false;
  for(const {spec,b} of seeded){
    let pl=list.find(x=>fold(x.name)===fold(spec.genre));
    if(!pl){const cat=PLCATS.find(x=>x.name===spec.genre);pl={id:'pl_builtin_'+spec.key,name:spec.genre,cover:cat?.cover||'',color:BUILTIN_BOOKS.indexOf(spec)%PLG.length,books:[],created:Date.now()};list.push(pl);changed=true}
    if(!pl.books.includes(b.id)){pl.books.push(b.id);changed=true}
  }
  if(changed)savePls(list);
  if(complete&&seeded.length===BUILTIN_BOOKS.length)LS.set(builtinSeedKey(),true);
}

function filtered(){

  const t=S.tab;
  if(t==='reading')L=L.filter(b=>b.progress>0&&!b.finished);
  else if(t==='new')L=L.filter(b=>!b.progress&&!b.finished);
  else if(t==='done')L=L.filter(b=>b.finished);
  else if(t==='fav')L=L.filter(b=>b.fav);

/* chamado a cada 5 s de leitura (pelo leitor) */
function readTick(){
  const st=getStats();const k=dayKey();const h=new Date().getHours();
  st.bk=st.bk||{};const arr=st.bk[k]=st.bk[k]||[];if(R.b&&!arr.includes(R.b.id)){arr.push(R.b.id)}
  st.flags=st.flags||{};if(h>=23||h<4)st.flags.owl=1;if(h>=4&&h<7)st.flags.early=1;
  st.cel=st.cel||{};let party=false;
  if((st.days[k]||0)>=needSec()&&!st.cel[k]){st.cel[k]=1;party=true}
  const keys=Object.keys(st.bk).sort();if(keys.length>40)keys.slice(0,keys.length-40).forEach(x=>delete st.bk[x]);
  LS.set(statKey(),st);
  if(party){const s=streak();const s2=getStats();s2.best=Math.max(s2.best||0,s);LS.set(statKey(),s2);celebrate(s)}
  else if(Math.random()<.2)checkAch();
}

function confetti(host,ms){
  const c=document.createElement('canvas');c.className='confetti';host.append(c);const W=c.width=innerWidth*devicePixelRatio,H=c.height=innerHeight*devicePixelRatio;const x=c.getContext('2d');
  const cols=['#6EF3D6','#9AAEFF','#FFB36B','#FF8FB1','#FFE45C'];const P=Array.from({length:130},()=>({x:W/2+(Math.random()-.5)*W*.2,y:H*.42,vx:(Math.random()-.5)*26,vy:-Math.random()*30-8,r:Math.random()*8+5,a:Math.random()*6,va:(Math.random()-.5)*.4,c:cols[Math.random()*5|0]}));
  const t0=performance.now();const step=t=>{const k=(t-t0)/ms;x.clearRect(0,0,W,H);if(k>1||!c.isConnected){c.remove();return}
    x.globalAlpha=Math.min(1,(1-k)*2);for(const p of P){p.vy+=.9;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()}requestAnimationFrame(step)};requestAnimationFrame(step);
}

  return new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s)});

/* ---------- entrega de arquivo: app Android, compartilhar do celular, download ---------- */
async function b64chunks(blob,fn){const buf=new Uint8Array(await blob.arrayBuffer());const CH=3*131072;
  for(let i=0;i<buf.length;i+=CH){const part=buf.subarray(i,i+CH);let s='';for(let j=0;j<part.length;j+=8192)s+=String.fromCharCode.apply(null,part.subarray(j,j+8192));fn(btoa(s));if(i%(CH*8)===0)await new Promise(r=>setTimeout(r,0))}}
let DL=null;
async function sendFile(blob,name,mime,title,preferShare){
  const P=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Astra;
  if(P){try{await P.fileBegin({name});const parts=[];await b64chunks(blob,s=>parts.push(s));for(const s of parts)await P.fileAppend({data:s});await P.fileShare({mime,title});return true}catch(e){console.error(e)}}
  const N=window.AstraNative;
  if(N&&N.fileBegin){try{N.fileBegin(name);await b64chunks(blob,s=>N.fileAppend(s));if(N.fileShare(mime,title))return true}catch(e){console.error(e)}}
  try{const f=new File([blob],name,{type:mime});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title});return true}}catch(e){if(e&&e.name==='AbortError')return false}
  try{if(window.claude&&claude.use){DL=DL||await claude.use('downloads');if(DL){await DL.save({filename:name,data:blob});toast('Arquivo salvo.');return true}}}catch(e){if(e&&e.code==='declined')return false}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);toast(preferShare?'Imagem salva na galeria, pronta para postar.':'Arquivo salvo.');return true}catch(e){toast('Não consegui salvar o arquivo.','err');return false}
}

async function exportBackup(){
  if(!window.JSZip){toast('O backup precisa do JSZip, que não carregou.','err');return}
  const p=S.profile;const t=toast('Preparando o backup…','ok',60000);
  try{const z=new JSZip();const books=[];
    for(const b of S.books){const blob=await DB.get('blobs','f:'+b.id);books.push(b);if(blob==null)continue;
      if(typeof blob==='string')z.file('livros/'+b.id+'.json',blob);else z.file('livros/'+b.id+'.bin',blob instanceof Blob?blob:new Uint8Array(blob.buffer?blob.buffer:blob))}
    z.file('astra.json',JSON.stringify({app:'astra-book',v:1,at:Date.now(),profile:p,set:S.set,stats:getStats(),vocab:vocab(),playlists:playlists(),books},null,0));
    const out=await z.generateAsync({type:'blob',compression:'STORE'});t&&t();
    const nm=`astra-backup-${fold(p.name||'perfil').replace(/[^a-z0-9]+/g,'-')}-${dayKey()}.zip`;
    await sendFile(out,nm,'application/zip','Salvar backup do Astra Book',false);
    LS.set('astra.lastbk.'+S.pid,Date.now());
  }catch(e){console.error(e);t&&t();toast('Não consegui fazer o backup.','err')}
}
async function importBackup(file){
  if(!file)return;if(!window.JSZip){toast('O JSZip não carregou.','err');return}
  const t=toast('Restaurando…','ok',60000);
  try{if(file.size>536870912)throw new Error('backup muito grande');const z=await JSZip.loadAsync(await file.arrayBuffer());const manifest=z.file('astra.json');if(!manifest)throw new Error('manifesto ausente');const rawJson=await manifest.async('string');if(rawJson.length>10000000)throw new Error('manifesto muito grande');const j=JSON.parse(rawJson);if(j.app!=='astra-book'||!Array.isArray(j.books)||j.books.length>2000)throw new Error('backup inválido');
    let n=0;const idmap={};for(const raw of j.books){if(!raw||!/^[a-z0-9_-]{1,100}$/i.test(String(raw.id||'')))continue;const b=sanitizeBook(raw);if(b.demo&&S.books.some(x=>x.demo))continue;
      const tf=z.file('livros/'+b.id+'.json'),bf=z.file('livros/'+b.id+'.bin');const ex=await DB.get('books',b.id);if(ex&&ex.owner!==S.pid){const nid='b_'+uid();idmap[b.id]=nid;b.id=nid}b.owner=S.pid;
      if(tf)await DB.put('blobs',await tf.async('string'),'f:'+b.id);else if(bf)await DB.put('blobs',(await bf.async('uint8array')).buffer,'f:'+b.id);else if(!(await DB.get('blobs','f:'+b.id)))continue;
      await DB.put('books',b);n++}
    const v=vocab();for(const w of j.vocab||[])if(!v.some(x=>fold(x.w)===fold(w.w)))v.push(w);LS.set(vocKey(),v);
    const st=getStats(),o=j.stats||{};for(const k of ['days','pages'])for(const [d,val] of Object.entries(o[k]||{}))st[k][d]=Math.max(st[k][d]||0,val);
    st.ach=Object.assign({},o.ach||{},st.ach||{});st.best=Math.max(st.best||0,o.best||0);st.flags=Object.assign({},o.flags||{},st.flags||{});st.cel=Object.assign({},o.cel||{},st.cel||{});st.bk=Object.assign({},o.bk||{},st.bk||{});LS.set(statKey(),st);
    const pl=playlists();for(const q of j.playlists||[])if(!pl.some(x=>x.id===q.id)){q.books=q.books.map(id=>idmap[id]||id);pl.push(q)}savePls(pl);
    if(j.set){S.set=Object.assign({},S.set,j.set);saveSet()}
    S.books=(await DB.books(S.pid)).map(sanitizeBook);t&&t();renderLib();toast(`Backup restaurado: ${n} livro${n===1?'':'s'}.`,'ok',4000);
  }catch(e){console.error(e);t&&t();toast('Esse arquivo não é um backup do Astra Book.','err',4000)}
}

function guessSeries(title){const m=/^(.*?)[\s,:\-–(]+(?:livro|vol\.?|volume|parte|tomo|book)\s*(\d+)\)?\s*$/i.exec(title||'');return m?{s:m[1].trim(),n:+m[2]}:null}
function groupedGrid(L,mode){
  const key=b=>mode==='author'?(b.author||'').trim()||'Autor desconhecido':(b.series||'').trim()||'Sem série';
  const map=new Map();for(const b of L){const k=key(b);if(!map.has(k))map.set(k,[]);map.get(k).push(b)}
  const ks=[...map.keys()].sort((a,b)=>{const la=/^(Sem série|Autor desconhecido)$/.test(a),lb=/^(Sem série|Autor desconhecido)$/.test(b);return la-lb||a.localeCompare(b,'pt')});
  let i=0;return ks.map(k=>{const bs=map.get(k);if(mode==='series')bs.sort((a,b)=>(a.seriesN||999)-(b.seriesN||999)||a.title.localeCompare(b.title,'pt'));
    return `<h3 class="ghead">${esc(k)}<small>${bs.length} livro${bs.length===1?'':'s'}</small></h3>`+bs.map(b=>cardHTML(b,i++)).join('')}).join('');
}

const CLOUD=(()=>{

  /* login com o Google: no app usa a tela nativa do Android, no site abre a janelinha do Google */
  const googleOk=()=>on&&(isNative?!!FA():true);
  async function googleCred(){const r=await FA().signInWithGoogle();const t=r&&r.credential&&r.credential.idToken;if(!t)throw{code:'astra/cancel'};return F.GoogleAuthProvider.credential(t)}
  async function google(){if(isNative)await F.signInWithCredential(auth,await googleCred());else await F.signInWithPopup(auth,new F.GoogleAuthProvider())}

    'auth/email-already-in-use':'Já existe uma conta com esse e-mail. Toque em Entrar.','auth/invalid-credential':'E-mail ou senha incorretos.','auth/wrong-password':'Senha incorreta.',
    'auth/user-not-found':'Não achei conta com esse e-mail.','auth/too-many-requests':'Muitas tentativas. Espere alguns minutos e tente de novo.','auth/network-request-failed':'Sem internet. Confira a conexão.',
    'auth/requires-recent-login':'Por segurança, entre de novo antes de excluir a conta.','auth/account-exists-with-different-credential':'Esse e-mail já tem conta com senha. Entre com e-mail e senha.',
    'auth/popup-blocked':'O navegador bloqueou a janela do Google. Libere pop-ups e tente de novo.'};
  const quiet=e=>/cancel|popup-closed|canceled|cancelled|12501/i.test((e&&(e.code||e.message))||'');

      const ids=new Set();
      for(const b of S.books){if(b.demo)continue;ids.add(b.id);const m=bookMeta(b);const s=sig(m);if(sent[b.id]!==s){await F.setDoc(F.doc(bcol(),b.id),m);sent[b.id]=s}}
