# Gera o arquivo .aab (para a Play Store) e um .apk (para testar no celular)
name: Gerar app Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Abrir o projeto
        run: |
          if [ -f projeto.zip ]; then unzip -oq projeto.zip; fi
          for z in $(ls atualizacao*.zip 2>/dev/null | sort); do unzip -oq "$z"; done
          if [ -d patch ]; then cp -r patch/. .; fi
          test -f remendo.js && cp remendo.js www/patch.js || true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Login com Google (arquivo do Firebase)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then
            echo "$GSJ" > android/app/google-services.json
          elif [ ! -f android/app/google-services.json ]; then
            echo "Sem google-services.json: gerando o app sem o botao do Google"
            pnpm remove @capacitor-firebase/authentication
          fi

      - name: Copiar o site para dentro do Android
        run: |
          cp firebase-config.js www/firebase-config.js
          pnpm run sync

      - name: Colocar a chave de upload
        env:
          KS_B64: ${{ secrets.ASTRA_KEYSTORE_B64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ASTRA_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Gerar AAB e APK
        working-directory: android
        env:
          ASTRA_KEYSTORE_PASSWORD: ${{ secrets.ASTRA_KEYSTORE_PASSWORD }}
          ASTRA_KEY_PASSWORD: ${{ secrets.ASTRA_KEYSTORE_PASSWORD }}
          ASTRA_KEY_ALIAS: upload
        run: |
          chmod +x gradlew
          sed -i -E 's/versionCode[[:space:]]+[0-9]+/versionCode 32/; s/versionName[[:space:]]+"[^"]+"/versionName "5.0"/' app/build.gradle
          grep -Eq 'versionCode[[:space:]]+32' app/build.gradle
          grep -Eq 'versionName[[:space:]]+"5.0"' app/build.gradle
          ./gradlew clean bundleRelease assembleRelease --no-daemon
          unzip -p app/build/outputs/bundle/release/app-release.aab base/manifest/AndroidManifest.xml > "$RUNNER_TEMP/astra-manifest.bin"
          grep -a -q '5.0' "$RUNNER_TEMP/astra-manifest.bin"

      - uses: actions/upload-artifact@v4
        with:
          name: astra-book-play-store
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
