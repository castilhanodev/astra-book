# Gera o arquivo .aab (para a Play Store) e um .apk (para testar no celular)
name: Gerar app Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Abrir o projeto
        run: |
          if [ -f projeto.zip ]; then unzip -oq projeto.zip; fi
          if [ -f atualizacao.zip ]; then unzip -oq atualizacao.zip; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependÃªncias
        run: npm ci

      - name: Login com Google (arquivo do Firebase)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then
            echo "$GSJ" > android/app/google-services.json
          elif [ ! -f android/app/google-services.json ]; then
            echo "Sem google-services.json: gerando o app sem o botÃ£o do Google"
            npm uninstall @capacitor-firebase/authentication
          fi

      - name: Copiar o site para dentro do Android
        run: |
          cp firebase-config.js www/firebase-config.js
          npx cap sync android

      - name: Colocar a chave de upload
        env:
          KS_B64: ${{ secrets.ASTRA_KEYSTORE_B64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ASTRA_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Gerar AAB e APK
        working-directory: android
        env:
          ASTRA_KEYSTORE_PASSWORD: ${{ secrets.ASTRA_KEYSTORE_PASSWORD }}
          ASTRA_KEY_PASSWORD: ${{ secrets.ASTRA_KEYSTORE_PASSWORD }}
          ASTRA_KEY_ALIAS: upload
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: astra-book-play-store
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
